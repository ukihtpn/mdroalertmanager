<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e6b5c">
<title>MDRO Census HTPN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: navy icon sidebar + sticky app bar, one fluid content column; wide tables scroll in their own box. Tokens copied from IPC HTPN Dashboard. */
:root{
  --bg:#f2f5f7; --panel:#ffffff; --panel2:#eef2f4; --line:#dde4e8; --ink:#13212e; --mut:#55636e; --mut2:#7d8a94;
  --navy:#0f2d4a; --navy-ink:#e7eff6; --title:#12304e; --gold:#e2b04a; --grad:linear-gradient(135deg,#14917f,#0b6a5e);
  --brand:#0f7a6c; --brand-ink:#ffffff; --brand-soft:#dcefeb;
  --ok:#1f9d5c; --ok-soft:#ddf3e6; --warn:#e07b12; --warn-soft:#fdebd6; --crit:#d23b33; --crit-soft:#fbe0de;
  --drop:#1f6fd1; --drop-soft:#e0ecfb; --empty:#a5b0ac; --scrim:rgba(10,18,16,.55); --onc:#ffffff;
  --f-disp:'Archivo',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d141b; --panel:#151f29; --panel2:#1c2833; --line:#2a3846; --ink:#eaf1f6; --mut:#a3b1bc; --mut2:#7e8c97;
  --navy:#0a1826; --navy-ink:#dce7f1; --title:#e6eef5; --gold:#e9bd5e; --grad:linear-gradient(135deg,#1aa18d,#0e7466);
  --brand:#3fb6a4; --brand-ink:#06201c; --brand-soft:#173a35;
  --ok:#3cc47d; --ok-soft:#163525; --warn:#f0953a; --warn-soft:#3b2812; --crit:#ef5e56; --crit-soft:#3d1a18;
  --drop:#6aa8f5; --drop-soft:#172a44; --empty:#55625e; --scrim:rgba(0,0,0,.6); --onc:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141b; --panel:#151f29; --panel2:#1c2833; --line:#2a3846; --ink:#eaf1f6; --mut:#a3b1bc; --mut2:#7e8c97;
  --navy:#0a1826; --navy-ink:#dce7f1; --title:#e6eef5; --gold:#e9bd5e; --grad:linear-gradient(135deg,#1aa18d,#0e7466);
  --brand:#3fb6a4; --brand-ink:#06201c; --brand-soft:#173a35;
  --ok:#3cc47d; --ok-soft:#163525; --warn:#f0953a; --warn-soft:#3b2812; --crit:#ef5e56; --crit-soft:#3d1a18;
  --drop:#6aa8f5; --drop-soft:#172a44; --empty:#55625e; --scrim:rgba(0,0,0,.6); --onc:#ffffff; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.demo-strip{background:var(--warn-soft);color:var(--ink);font-size:12px;text-align:center;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.demo-strip b{color:var(--warn)}
.demo-strip button{color:var(--brand);font-weight:700;text-decoration:underline;font-size:12px}

/* LOGIN */
#login{position:relative;overflow:hidden;min-height:calc(100vh - 30px);display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lg-deco{position:absolute;pointer-events:none}
.lg-deco.tl{top:0;left:0;width:min(46vw,560px)}
.lg-deco.br{bottom:0;right:0;width:min(46vw,560px)}
.lg-card{position:relative;width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 32px 24px;box-shadow:0 10px 40px rgba(15,45,74,.12)}
.lg-brand{display:flex;gap:16px;align-items:center;margin-bottom:24px}
.lg-brand img{width:84px;height:auto;flex:0 0 auto}
.lg-brand .div{width:2px;align-self:stretch;background:var(--gold);border-radius:2px}
.lg-brand h1{font-size:27px;line-height:1.05;color:var(--title);font-weight:900}
.lg-brand h1 em{font-style:normal;color:var(--brand);display:block}
.lg-brand p{font-size:12px;margin:8px 0 0;color:var(--mut)}
.lg-q{font:800 15px/1.2 var(--f-disp);color:var(--title);margin:4px 0 2px}
.lg-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.lg-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;transition:border-color .15s,transform .15s}
.lg-tile:hover{border-color:var(--brand);transform:translateY(-1px)}
.lg-tile .ti{width:48px;height:48px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center}
.lg-tile .ti svg{width:26px;height:26px}
.lg-tile b{font:800 17px/1.1 var(--f-disp);color:var(--title)}
.lg-tile span:last-child{font-size:12.5px;color:var(--mut)}
.lg-back{font-size:13px;font-weight:700;color:var(--brand);padding:2px 0;margin-bottom:6px}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.fld label,.lbl{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--line);border-radius:9px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:9px;font-weight:700;font-size:13.5px;border:1.5px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-pri{background:var(--grad);color:#fff}
.btn-pri:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--panel);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--mut2)}
.btn-crit{background:var(--crit);color:var(--onc)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%;margin-top:18px;padding:13px;font-size:15px;border-radius:12px}
.err{color:var(--crit);font-size:13px;min-height:18px;margin-top:8px;font-weight:600}
.hint{font-size:12px;color:var(--mut2);margin-top:14px;line-height:1.6}
.hint code{font-family:var(--f-mono);background:var(--brand-soft);color:var(--brand);padding:2px 7px;border-radius:5px;font-weight:700}
.lg-card .hint{text-align:center;border-top:1px solid var(--line);padding-top:14px;margin-top:18px}

/* APP SHELL */
#app{display:grid;grid-template-columns:104px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--navy) 104px,var(--bg) 104px)}
#app[hidden]{display:none!important}
.sbar{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px;gap:6px;z-index:31}
.sbar .logo{width:76px;height:76px;margin:0 auto 6px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden}
.sbar .logo img{width:68px}
.sbar hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:8px 0;width:100%}
#snav{display:flex;flex-direction:column;gap:6px;width:100%}
.snav{width:100%;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:12px;color:var(--navy-ink);font-size:12px;font-weight:600;text-align:center;line-height:1.2;opacity:.82;position:relative}
.snav svg{width:22px;height:22px}
.snav:hover{opacity:1;background:rgba(255,255,255,.07)}
.snav[aria-selected="true"]{background:var(--grad);opacity:1;color:#fff}
.cnt{font:700 10px/1 var(--f-mono);background:var(--crit);color:var(--onc);border-radius:999px;padding:3px 6px}
.snav .cnt{position:absolute;top:6px;right:10px}
.content{min-width:0}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.ab-row{padding:12px 24px;display:flex;align-items:center;gap:14px}
.ab-title{flex:1;min-width:0}
.ab-title b{font:900 20px/1.2 var(--f-disp);color:var(--title);display:block}
.ab-title span{font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icobtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--title)}
.icobtn:hover{background:var(--panel2)}
.icobtn svg{width:21px;height:21px}
.thm .i-moon{display:none}.thm.dark .i-sun{display:none}.thm.dark .i-moon{display:block}
.btn-out{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;color:var(--title);background:var(--panel)}
.btn-out svg{width:17px;height:17px}
.tabs{display:none;padding:0 12px;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 12px 11px;font-weight:700;font-size:13.5px;color:var(--mut);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
main{padding:24px 28px 60px}
.page{display:none;flex-direction:column;gap:20px}
.page.on{display:flex}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:22px;font-weight:800;color:var(--title)}
.sec-h p{margin:3px 0 0;color:var(--mut);font-size:14px;max-width:75ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(15,45,74,.04),0 4px 16px rgba(15,45,74,.05);min-width:0}
.pad{padding:16px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:16px 16px 12px}
.ph h3{font-size:16px;font-weight:800;color:var(--title)}
.ph p{margin:2px 0 0;font-size:13px;color:var(--mut)}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .sbar{display:none}.tabs{display:flex}
  .ab-row{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  main{padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .ab-title b{font-size:17px}.btn-out span{display:none}
}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px 22px;display:flex;gap:12px;align-items:flex-start;overflow:hidden;text-align:left}
.stat::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--c)}
.stat .ico{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.stat .ico svg{width:22px;height:22px}
.stat .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .top{color:var(--title);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .n{font:900 34px/1 var(--f-disp);color:var(--title);font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--mut)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{flex-direction:column;gap:8px;padding:14px 12px 14px 20px}.stat .n{font-size:28px}}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--title);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
td.nm b{display:block;font-weight:700;white-space:nowrap}
td.nm span{font-size:12px;color:var(--mut2);display:block;white-space:nowrap}
.empty-row{text-align:center;color:var(--mut2);padding:28px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{flex:1;min-width:160px;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);outline:none}
.tsel{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-drop{background:var(--drop-soft);color:var(--drop)}
.p-mut{background:var(--panel2);color:var(--mut)}
.p-brand{background:var(--brand-soft);color:var(--brand)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.namebtn{font-weight:700;text-align:left;color:var(--brand);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.namebtn.mdro{color:var(--crit)}
/* Excel-like masterlist */
.xl{font-size:12.5px}
.xl th{position:sticky;top:0;z-index:1}
.xl td{white-space:nowrap;padding:7px 10px;border-right:1px solid var(--line)}
.xl th{border-right:1px solid var(--line)}
.xl tbody tr{cursor:pointer}
.xl td.rn{color:var(--mut2);font-family:var(--f-mono);font-size:11px;text-align:right;background:var(--panel2)}
.xl-scroll{overflow:auto;max-height:62vh}

/* census editor */
.ed td{padding:5px 6px}
.ed input{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg);outline:none;min-width:70px}
.ed input:focus{border-color:var(--brand)}
.ed td.b{width:86px}.ed td.nmc{min-width:220px}.ed td.rnc{width:120px}.ed td.icc{width:160px}
.ed tr.is-mdro td{background:var(--crit-soft)}
.ed tr.is-in td{background:var(--drop-soft)}
.xbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mut)}
.xbtn:hover{background:var(--crit-soft);color:var(--crit)}
.edfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.banner{border-radius:12px;padding:12px 16px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.banner.info{background:var(--brand-soft);color:var(--ink)}
.banner.info svg{color:var(--brand)}
.banner.drop{background:var(--drop-soft)}.banner.drop svg{color:var(--drop)}
.banner.crit{background:var(--crit-soft)}.banner.crit svg{color:var(--crit)}
.banner.warn{background:var(--warn-soft)}.banner.warn svg{color:var(--warn)}
.banner b{font-weight:700}
.banner ul{margin:6px 0 0;padding-left:18px}

/* bed grid */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;padding:16px}
.bed{border-radius:10px;padding:8px 9px;min-height:66px;display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--panel2)}
.bed .bn{font:700 11.5px/1 var(--f-mono);color:var(--mut)}
.bed .pn{font-size:12px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bed.ok{background:var(--ok-soft);border-color:transparent}
.bed.mdro{background:var(--crit);border-color:var(--crit);color:var(--onc)}
.bed.mdro .bn{color:var(--onc);opacity:.85}
.bed .og{font:700 10.5px/1.2 var(--f-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);padding:10px 16px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ward chips */
.wchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 16px 16px}
.wchip{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left}
.wchip b{font:800 15px/1.1 var(--f-disp);color:var(--title)}
.wchip span{font-size:12px;color:var(--mut)}
.wchip.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:var(--ok-soft)}
.wchip.late{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:var(--warn-soft)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.moves{display:flex;flex-direction:column;gap:7px;padding:0 16px 16px;font-size:13px}
.mv{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.mv .d{font:500 11.5px/1.4 var(--f-mono);color:var(--mut);flex:0 0 auto;min-width:74px}
.mv .tx{min-width:0}
.bars{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.barrow{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px}
.barrow .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--brand);border-radius:5px}
.barrow b{font-family:var(--f-mono);text-align:right;font-size:12.5px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:900px}
.m-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:2}
.m-head .hx{flex:1;min-width:0}
.m-head h3{font-size:17px;font-weight:800;color:var(--title)}
.m-head p{margin:3px 0 0;font-size:12.5px;color:var(--mut)}
.x{width:32px;height:32px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.m-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.m-foot{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.m-foot .sp{flex:1}
.fsec{border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin:0;min-width:0}
.fsec legend{font:800 13.5px/1 var(--f-disp);padding:0 6px;color:var(--title)}
.fsec .who{font-size:12px;color:var(--mut);margin:6px 0 0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:0 12px}
.fg .fld{margin-top:10px}
.fg .full{grid-column:1/-1}
.fg .fld input,.fg .fld select,.fg .fld textarea{padding:8px 10px}
.chkl{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px;font-weight:600}
.lookup{position:relative}
.lk-res{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lk-res button{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--bg)}
.lk-res button:hover{border-color:var(--brand)}
.lk-res small{color:var(--mut);font-family:var(--f-mono);font-size:11.5px}
.miss{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.miss .mh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.miss .mh b{font-weight:700}
.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 10px;border-radius:7px;font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mrow .fld{margin:0}
.mrow .fld input,.mrow .fld select{padding:8px 10px}
.alert{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--crit-soft);border:2px solid var(--crit)}
.alert .ah{font:900 16px/1.2 var(--f-disp);color:var(--crit);letter-spacing:.02em}
.alert ul{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mut)} .kv dd{margin:0;font-weight:600}
/* notification form */
.nform{display:flex;flex-direction:column;gap:12px}
.nform fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 14px 14px;margin:0;min-width:0}
.nform legend{font:800 13.5px/1 var(--f-disp);padding:0 6px}
.opt{display:inline-flex;gap:7px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--brand)}
.opts{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:8px}
.opts.col{flex-direction:column;gap:7px}
.nform input:not([type=radio]),.nform select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
table.abx td{padding:5px 6px} table.abx input{min-width:110px}
textarea.paste{width:100%;min-height:200px;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font:13px/1.5 var(--f-mono)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:90;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2: mapping, analysis, census grid ===== */
:root{--air:#6a4bc4;--air-soft:#ebe5fb;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#e3e8ec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--air:#a38cf0;--air-soft:#2a2245;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#243240}}
:root[data-theme="dark"]{--air:#a38cf0;--air-soft:#2a2245;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#243240}
.p-air{background:var(--air-soft);color:var(--air)}
.map-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;border-bottom:1px solid var(--line)}
.map-ctl .fld{margin:0}
.map-ctl .fld select,.map-ctl .fld input{padding:8px 10px}
.datebox{display:flex;gap:6px;align-items:center}
.datebox input{width:150px}
.map-body{display:grid;grid-template-columns:minmax(0,1fr) 290px}
@media (max-width:980px){.map-body{grid-template-columns:minmax(0,1fr)}}
.map-canvas{padding:16px;min-width:0;border-right:1px solid var(--line)}
@media (max-width:980px){.map-canvas{border-right:none;border-bottom:1px solid var(--line)}}
.side{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.census{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.census div{background:var(--panel2);border-radius:9px;padding:9px 10px;font-size:12px;color:var(--mut)}
.census b{display:block;font:800 22px/1.1 var(--f-disp);color:var(--ink);font-variant-numeric:tabular-nums}
.side .moves{padding:0}
.stage{position:relative;width:100%;max-width:1035px;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;--m:30px;touch-action:none}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.bed-m{position:absolute;transform:translate(-50%,-50%);width:var(--m);height:var(--m);border-radius:22%;border:2px solid #fff;display:grid;place-items:center;font:700 calc(var(--m)*.34)/1 var(--f-mono);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:0}
.st-g{background:var(--ok)} .st-a{background:var(--warn)} .st-r{background:var(--crit)} .st-e{background:var(--empty);opacity:.85}
.rg-air{box-shadow:0 0 0 3px var(--air),0 2px 6px rgba(0,0,0,.35)}
.rg-drop{box-shadow:0 0 0 3px var(--drop),0 2px 6px rgba(0,0,0,.35)}
.stage.edit .bed-m{cursor:grab}
.stage.edit.arm{cursor:crosshair}
.grid-ward{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bay{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--panel2);min-width:0}
.bay.iso{background:var(--air-soft)}
.bay h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.bay .bts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.bed-t{border-radius:8px;padding:7px 7px;color:#fff;text-align:left;min-height:60px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bed-t .bn{font:700 11px/1 var(--f-mono);opacity:.9}
.bed-t .pn{font-size:11.5px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bed-t .tg{font:700 10px/1.2 var(--f-mono);opacity:.95}
.bed-t.st-e{color:var(--onc)}
.devs{display:flex;gap:4px;flex-wrap:wrap}
.dv{font:700 10.5px/1 var(--f-mono);padding:5px 6px;border-radius:6px;border:1.5px solid var(--line);color:var(--mut);background:var(--panel)}
.dv[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.infbtn{font-size:11.5px;font-weight:700;color:var(--brand);padding:3px 6px;border-radius:6px;border:1.5px dashed var(--line)}
.infbtn:hover{border-color:var(--brand)}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.totals .fld{margin:0}
.totals .fld input{padding:8px 10px}
.sumchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px}
.sumchips span{background:var(--panel2);border-radius:7px;padding:4px 8px;color:var(--mut)}
.sumchips b{color:var(--ink);font-family:var(--f-mono)}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.chkgrid label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer}
.chkgrid input{accent-color:var(--brand)}
.chkgrid small{color:var(--mut);margin-left:auto;font-size:11px}
/* analysis */
.an-ctl{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px}
.an-ctl .fld{margin:0;min-width:160px;flex:1 1 160px;max-width:260px}
.an-ctl .fld select{padding:8px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 16px 16px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font:800 22px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--title)}
.kpi i{font-style:normal;font-size:12px;color:var(--mut2)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chart h3{font-size:14.5px;font-weight:800;color:var(--title)}
.chart .cbox{position:relative;height:250px;width:100%}
.chart .cbox.tall{height:320px}
.chart .note{font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}
table.num td:not(:first-child),table.num th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
table.num tr.sel td{background:var(--brand-soft);font-weight:700}
.planbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.bchips button{font:700 11.5px/1 var(--f-mono);padding:6px 8px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel)}
.bchips button.placed{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.bchips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
#tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 11px;border-radius:9px;pointer-events:none;max-width:240px;line-height:1.45}
.wtbl td.wn{font-weight:800;font-family:var(--f-disp)}
.wtbl tbody tr{cursor:pointer}
.wtbl tr.open td{background:var(--brand-soft)}
table.mini{font-size:13px;width:100%}table.mini td,table.mini th{padding:7px 9px;text-align:left!important}
.wtbl td:nth-child(2),.wtbl td:nth-child(3),.wtbl th:nth-child(2),.wtbl th:nth-child(3){text-align:left!important}
/* register + attachments */
.regwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.regmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.regside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);min-width:0}
@media (max-width:1000px){.regwrap{grid-template-columns:minmax(0,1fr)}.regside{display:contents}.attpanel{order:-1}.regact{order:2}}
.regside h3{font-size:15px;font-weight:800;color:var(--title)}
.regact{display:flex;flex-direction:column;gap:8px}
.attbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.attbtns .btn{white-space:normal;padding:11px 10px;flex-direction:column;gap:5px;font-size:12.5px}
.attbtns .btn svg{width:22px;height:22px;color:var(--brand)}
.drop{margin-top:10px;border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:12.5px;color:var(--mut)}
.drop.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
@media (hover:none){.drop{display:none}}
.atts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.att{display:flex;gap:10px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:10px;min-width:0}
.att-th{position:relative;width:58px;height:58px;border-radius:7px;overflow:hidden;flex:0 0 auto;background:var(--panel2);display:grid;place-items:center}
.att-th img{width:100%;height:100%;object-fit:cover}
.att-th .ftag{position:absolute;left:0;right:0;bottom:0;font:700 9.5px/1.4 var(--f-mono);font-style:normal;background:var(--crit);color:var(--onc);text-align:center}
.pdfi{font:800 13px/1 var(--f-mono);color:var(--crit)}
.att-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.att-m b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-m span{font-size:11.5px;color:var(--mut)}
.fsec .atts{margin-bottom:2px}
.viewer{display:flex;flex-direction:column;gap:12px;align-items:center}
.viewer img,.viewer canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.st-u{background:var(--panel2);color:var(--mut)}.bed-m.st-u{background:var(--empty);opacity:.4;color:#fff}.bed-t.st-u{color:var(--mut)}
.imp-drop{display:flex!important;flex-direction:column;align-items:center;gap:8px;padding:22px}
.impsec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.impsec p{margin:0;font-size:13px;color:var(--mut)}
.imph{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px;flex-wrap:wrap}
.imph input{accent-color:var(--brand);width:16px;height:16px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:6px 10px;align-items:center;font-size:13px}
.mapgrid small{color:var(--mut2)}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--brand);padding:2px 0}
.clsb{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.clsb .seg{background:var(--panel)}
.clsb .seg button{display:flex;flex-direction:column;gap:2px;align-items:center;white-space:normal;text-align:center;padding:9px 8px;min-width:0;flex:1 1 0}
.clsb .seg button small{font-weight:500;font-size:11px;opacity:.85}
.clsb .seg button:disabled{opacity:.4;cursor:not-allowed}
.clsres{font-size:13px;line-height:1.5}
.flow h3{margin-bottom:8px}
.flow ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--mut)}
.flow b{color:var(--ink)}
@media (max-width:1000px){.flow{order:3}}
/* forms workflow + doctor view */
.acts{display:flex;gap:6px;flex-wrap:wrap}
.nform .nf-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
#docView{min-height:100vh;background:var(--bg)}
.doc-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.doc-in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.doc-in img{width:40px;height:40px;border-radius:9px;background:#fff;object-fit:contain}
.doc-in div{flex:1;min-width:0;display:flex;flex-direction:column}
.doc-in b{font:800 16px/1.2 var(--f-disp);color:#fff}
.doc-in span{font-size:12px;opacity:.85}
.doc-main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.doc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.doc-sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.doc-sum span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}
.doc-sum b{font-size:14px;overflow-wrap:anywhere}
.doc-act{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.doc-act .btn-block{margin-top:0}
.doc-done{text-align:center;display:flex;flex-direction:column;gap:8px;padding:32px 16px}
.doc-done h2{color:var(--title)}
.doc-done p{margin:0;color:var(--mut)}
.doc-in .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
/* classification colours */
.clsb .seg button[data-v="INFECTION"]{border:1.5px solid color-mix(in srgb,var(--crit) 35%,transparent)}
.clsb .seg button[data-v="COLONIZER"]{border:1.5px solid color-mix(in srgb,var(--drop) 35%,transparent)}
.clsb .seg button[data-v="CONT"]{border:1.5px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.clsb .seg button[data-v="HAI - own hospital"]{border:1.5px solid color-mix(in srgb,var(--air) 35%,transparent)}
.clsb .seg button[data-v="HAI - other facility"]{border:1.5px solid color-mix(in srgb,var(--brand) 35%,transparent)}
.clsb .seg button[data-v="NOT HCAI"]{border:1.5px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.clsb .seg button[data-v="INFECTION"][aria-pressed="true"]{background:var(--crit)}
.clsb .seg button[data-v="COLONIZER"][aria-pressed="true"]{background:var(--drop)}
.clsb .seg button[data-v="CONT"][aria-pressed="true"]{background:var(--warn)}
.clsb .seg button[data-v="HAI - own hospital"][aria-pressed="true"]{background:var(--air)}
.clsb .seg button[data-v="HAI - other facility"][aria-pressed="true"]{background:var(--brand)}
.clsb .seg button[data-v="NOT HCAI"][aria-pressed="true"]{background:var(--ok)}
.clsb .seg button[aria-pressed="true"]{color:#fff}
.filled{border-color:var(--ok)!important;background:var(--ok-soft)!important}
/* masterlist groups */
.ovlegend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:12.5px;color:var(--mut)}
.ovlegend span{display:inline-flex;gap:6px;align-items:center}.ovlegend i{width:10px;height:10px;border-radius:50%;display:inline-block}
details.grp>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(150px,auto) minmax(120px,1fr) auto;gap:14px;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:hover{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
details.grp[open]>summary{border-bottom:1px solid var(--line)}
.gh{display:flex;flex-direction:column}.gh b{font:800 16px/1.2 var(--f-disp);color:var(--title)}.gh b::before{content:"▸ ";color:var(--mut)}details[open] .gh b::before{content:"▾ "}.gh span{font-size:12.5px;color:var(--mut)}
.gbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);gap:2px}.gbar i{display:block;height:100%}
.gc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){details.grp>summary{grid-template-columns:1fr}.gc{justify-content:flex-start}}
.grpt tr.ov-done td:first-child{box-shadow:inset 4px 0 var(--ok)}.grpt tr.ov-pend td:first-child{box-shadow:inset 4px 0 var(--warn)}.grpt tr.ov-none td:first-child{box-shadow:inset 4px 0 var(--crit)}
.ovdot{width:10px;height:10px;border-radius:50%;display:inline-block}
/* profile */
.prof-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.prof-top>div{background:var(--panel2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.prof-top span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}.prof-top small{font-size:12px;color:var(--mut)}
.sub-h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.revs{display:flex;flex-direction:column;gap:8px}.rev{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rev div{display:flex;flex-direction:column;gap:2px;min-width:0}.rev span{font-size:12px;color:var(--mut)}.rev p{margin:2px 0 0;font-size:13px}
.atts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
/* review form */
.revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.revgrid div{background:var(--panel2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.revgrid span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700}.revgrid b{font-size:13.5px;overflow-wrap:anywhere}

.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.audl button:not(:disabled):hover{border-color:var(--brand);background:var(--brand-soft)}
.audl button:not(:disabled):active{transform:scale(.98)}
.audl button.audsel{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important}
th.pw-ward{background:#fff4d6!important;color:#7a5a00!important}th.pw-uki{background:#e3f1ee!important;color:#0b6a5e!important}
b.pw-ward{color:#9a6c00}b.pw-uki{color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) th.pw-ward{background:#3a3114!important;color:#f5d27a!important}:root:not([data-theme="light"]) th.pw-uki{background:#123430!important;color:#8fe0cf!important}}
:root[data-theme="dark"] th.pw-ward{background:#3a3114!important;color:#f5d27a!important}:root[data-theme="dark"] th.pw-uki{background:#123430!important;color:#8fe0cf!important}
.kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}.kpi.click:hover{box-shadow:0 0 0 2px var(--brand-soft);border-color:var(--brand)}
.fbox{background:var(--brand-soft);border-radius:12px;padding:12px 14px}.fml{font-size:15px;margin:2px 0 6px;line-height:1.5}
.lk-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut,#667);margin:6px 0 0}
.segf{display:flex;flex-wrap:wrap;gap:6px}
.segf button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink,#222)}
.segf button b{color:var(--c);margin-left:3px}
.segf button.on{background:var(--c);border-color:var(--c);color:#fff}.segf button.on b{color:#fff}
.sdn{font-family:inherit;font-size:11px;font-weight:600;margin-top:3px;max-width:170px;line-height:1.3}
.sdn.crit{color:var(--crit)}.sdn.warn{color:var(--warn)}
.tapnote{color:var(--brand);font-weight:700;margin-left:6px;animation:tapb 1.6s ease-in-out infinite}@keyframes tapb{50%{opacity:.45}}
.othf{margin:10px 0 0;padding:10px 12px;border:1.5px solid var(--warn);border-radius:10px;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.othf label{color:var(--warn)}
.errf{border-color:var(--crit)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 20%,transparent)}
/* precaution colours: MDRO red · airborne yellow · droplet orange · contact purple */
:root{--air:#b88a00;--air-soft:#fdf3c4;--airf:#f2c200;--dpl:#e8620c;--dpl-soft:#fde4d2;--con:#7c4dcc;--con-soft:#ece4fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--air:#f2c94c;--air-soft:#3a3010;--airf:#e0b400;--dpl:#ff8a3d;--dpl-soft:#3d2414;--con:#a98bf0;--con-soft:#2a2245}}
:root[data-theme="dark"]{--air:#f2c94c;--air-soft:#3a3010;--airf:#e0b400;--dpl:#ff8a3d;--dpl-soft:#3d2414;--con:#a98bf0;--con-soft:#2a2245}
.st-y{background:var(--airf);color:#1d1600!important}.st-o{background:var(--dpl)}.st-a{background:var(--con)}
.rg-air{box-shadow:0 0 0 3px var(--airf),0 2px 6px rgba(0,0,0,.35)}
.rg-drop{box-shadow:0 0 0 3px var(--dpl),0 2px 6px rgba(0,0,0,.35)}
.rg-con{box-shadow:0 0 0 3px var(--con),0 2px 6px rgba(0,0,0,.35)}
.p-dpl{background:var(--dpl-soft);color:var(--dpl)}.p-con{background:var(--con-soft);color:var(--con)}
.misslist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--crit)}
.stats.fclick .stat.fsel{outline:3px solid var(--c);outline-offset:-1px;background:color-mix(in srgb,var(--c) 8%,var(--panel))}
tr.fsel td{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.syncbtn{margin-right:6px}.syncbtn .spin{width:14px;height:14px}@media(max-width:700px){.syncbtn span:last-child{display:none}}
.iwf{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 16px 10px}.iwf .seg{flex:none}.iwf input{flex:1;min-width:200px}
.iwsum{display:flex;gap:10px;flex-wrap:wrap;padding:4px 16px 12px}
.iwt{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;border-radius:12px;background:var(--crit-soft,#fde8e8);min-width:130px}.iwt b{font:900 26px/1 var(--f-disp);color:var(--crit)}.iwt span{font-size:12px;color:var(--mut)}
.iwt.inf{background:var(--air-soft)}.iwt.inf b{color:var(--air)}
.iwc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);text-align:left}.iwc:hover{border-color:var(--brand)}
.iwc span{display:flex;gap:4px}.iwc i{font-style:normal}.iwc small{font-size:11px;color:var(--mut)}
.nowbox{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--panel2);border-left:4px solid var(--brand)}
.nowbox span{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.nowbox b{display:block;font-size:15px;color:var(--ink)}.nowbox small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
@media(max-width:600px){.nowbox{grid-template-columns:1fr}}

.syncst{position:fixed;left:12px;bottom:12px;z-index:90;border:0;border-radius:999px;padding:7px 14px;font:600 12.5px/1 inherit;background:var(--ink);color:var(--panel);box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.syncst[data-k="1"]{background:var(--ok);color:#fff}.syncst[data-k="2"]{background:var(--crit);color:#fff}
.docmode .doc-bar .btn{display:none}
.doc-err{max-width:520px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;text-align:center}
.apiset{max-width:520px;margin:10vh auto;padding:24px;font-family:system-ui,sans-serif}.apiset input{width:100%;padding:10px;margin:10px 0;font:inherit}

</style>
</head>

  /* SPC: baseline = completed months before the selected / current month */
  const lastM=sm>=0?Math.min(sm,CUR_M):CUR_M;const base=M.filter(r=>r.m<lastM).map(r=>r.rate);const mean=base.reduce((a,b)=>a+b,0)/(base.length||1);const sd=Math.sqrt(base.reduce((a,b)=>a+(b-mean)**2,0)/((base.length-1)||1));
  const B=chartBase();const brand=cssv("--brand"),crit=cssv("--crit"),warn=cssv("--warn"),mut=cssv("--mut2");
  const over=M.filter(r=>r.rate>mean+2*sd);

    options:{...B,scales:{...B.scales,y:{...B.scales.y,ticks:{...B.scales.y.ticks,precision:undefined},title:{display:true,text:"per 100 admissions",color:cssv("--mut")}}}}});
  const unc=M.reduce((a,r)=>a+(r.k.UNREV||0),0);$("nSpc").innerHTML=(unc>0?`<b style="color:var(--warn)">${unc} NEW cases not yet classified (awaiting UKI review) — not counted until classified.</b> `:"")+`Mean <b>${mean.toFixed(2)}</b>, SD ${sd.toFixed(2)} (months Jan–${MON3[Math.max(0,lastM-1)]}${sm>=0?`, compared with ${MON3[sm]}`:""}). ${lastM===CUR_M?`${MON3[CUR_M]} is incomplete, so its rate may change. `:""}${over.length?`Above +2 SD: <b>${over.map(r=>MON3[r.m]).join(", ")}</b>.`:"No month above +2 SD."}`;
  const gs=S.an.org?[S.an.org]:MAIN_ORG;
  CH.org=new Chart($("cOrg"),{type:"bar",data:{labels:L,datasets:gs.map(g=>({label:g,data:full(M.map(r=>r.byG[g]||0)),backgroundColor:cssv(MORG_COL[g]),borderColor:cssv("--panel"),borderWidth:{top:2},borderRadius:3,stack:"s"}))},options:{...B,scales:{...B.scales,x:{...B.scales.x,stacked:true},y:{...B.scales.y,stacked:true}}}});
  const CS=C.filter(c=>sm===-1||+c.sample_date.slice(5,7)-1===sm);
  const cnt=(arr,key)=>{const o={};arr.forEach(c=>{const k=c[key]||"Not recorded (empty)";o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const hbar=(id,E)=>CH[id]=new Chart($(id),{type:"bar",data:{labels:E.map(e=>e[0]),datasets:[{label:"Cases",data:E.map(e=>e[1]),backgroundColor:brand,borderRadius:3,barThickness:14}]},options:{...B,indexAxis:"y",interaction:{mode:"nearest",intersect:true,axis:"y"},plugins:{...B.plugins,legend:{display:false}},scales:{x:{...B.scales.y},y:{...B.scales.x,ticks:{color:cssv("--mut"),autoSkip:false,font:{size:11}}}}}});

  drawEpi(C,B);
  /* daily trend, last 60 days */
  const days=[];for(let d=addDays(TODAY,-59);d<=TODAY;d=addDays(d,1))days.push(d);const DR=dayRows().filter(r=>!S.an.ward||r.ward===S.an.ward);

    options:{...B,scales:{...B.scales,x:{...B.scales.x,ticks:{color:cssv("--mut"),maxTicksLimit:10}}}}});

function buildSummary(date,time,withBed,rem,pos){const[h,m]=time.split(":").map(Number);const lim=at(date,h,m);const used=[],late=[],stale=[];

function okDate(d,R){if(!d)return"";if(d>TODAY||d<"2020-01-01"){if(R)R.bad=(R.bad||0)+1;return""}return d}
function transposed(A){if(A.length<3)return null;const beds=A.slice(1).filter(r=>/^(BED\b|ISO\b|R\d|CTG)/i.test(String(r[0]).trim()));if(beds.length<3)return null;
  const dc=A[0].map((x,j)=>j>0?[j,okDate(toYmd(x))]:null).filter(x=>x&&x[1]);if(dc.length<5)return null;
  const cells=[];beds.forEach(r=>dc.forEach(([j,d])=>{const v=String(r[j]??"").trim();if(v)cells.push([d,String(r[0]).trim(),v])}));return{cells}}
const BULAN={JANUARI:1,FEBRUARI:2,MAC:3,APRIL:4,MEI:5,JUN:6,JULAI:7,OGOS:8,SEPTEMBER:9,OKTOBER:10,NOVEMBER:11,DISEMBER:12};
function parsePD211(A,R,sn){let ym="";for(let i=0;i<Math.min(10,A.length);i++){const t=A[i].map(String).join(" ").toUpperCase();const m=t.match(/UNTUK BULAN\s+([A-Z]+)\s+TAHUN\s+(\d{4})/);if(m&&BULAN[m[1]]){ym=m[2]+"-"+pad(BULAN[m[1]]);break}}
  if(!ym)return false;let hi=A.findIndex(r=>r.filter(x=>/^WAD\s/i.test(String(x).trim())).length>=5);if(hi<0)return false;
  const cols=A[hi].map((x,j)=>/^WAD\s/i.test(String(x).trim())?j:-1).filter(j=>j>=0);const F={beds_rasmi:/KATIL RASMI/,beds_op:/KATIL OPERASI/,adm:/^KEMASUKAN/,pd:/JUMLAH HARI PESAKIT/,home:/BALIK KE RUMAH/,trans_out:/PINDAH KE HOSPITAL/,deaths:/^MATI/,disc:/JUMLAH PESAKIT DISCAJ/,alos:/PURATA MASA TINGGAL/};
  const val={};for(let i=hi+1;i<Math.min(A.length,hi+30);i++){const lab=String(A[i][1]||"").trim().toUpperCase();const k=Object.keys(F).find(f=>F[f].test(lab));if(k&&!val[k])val[k]=A[i]}
  if(!val.adm||!val.pd)return false;const seen={};let any=false;
  cols.forEach(j=>{let label=String(A[hi][j]).replace(/\s+/g," ").trim();let code=wardCode(label);if(seen[label]){if(code==="ICU MB")code="ICU WCC";label+=" (second)"}if(/HDW/.test(label.toUpperCase())&&!/PHDW/.test(label.toUpperCase()))code="ICU WCC";if(/PHDW/i.test(label))code="";seen[label.replace(" (second)","")]=1;
    const g=k=>val[k]?num(String(val[k][j]).startsWith("#")?0:val[k][j]):0;const o={ym,label,code,beds_rasmi:g("beds_rasmi"),beds_op:g("beds_op"),adm:g("adm"),pd:g("pd"),disc:g("disc"),deaths:g("deaths"),trans_out:g("trans_out"),sheet:sn};
    if(!o.adm&&!o.pd)return;any=true;if(!code)R.mmap[label]=R.mmap[label]||"";R.monthly.push(o)});
  if(!any)R.skipped.push(sn+" (empty)");return true}
function pdHTML(R){if(!R.monthly.length)return"";const months=[...new Set(R.monthly.map(x=>x.ym))].sort();const um=Object.keys(R.mmap);const wardOpt=`<option value="">Ignore</option>`+WARDS.map(w=>`<option>${w}</option>`).join("");
  const tot=R.monthly.filter(x=>x.code);const sum=f=>tot.reduce((a,x)=>a+x[f],0);

   <details><summary>View table</summary><div class="tbl-wrap"><table class="mini num"><thead><tr><th>Ward</th>${months.map(m=>`<th>${MON3[+m.slice(5)-1]}</th>`).join("")}</tr></thead><tbody>${[...new Set(R.monthly.map(x=>x.label))].map(l=>`<tr><td>${esc(l)}${R.monthly.find(x=>x.label===l).code?` → ${esc(R.monthly.find(x=>x.label===l).code)}`:""}</td>${months.map(m=>{const xs=R.monthly.filter(x=>x.label===l&&x.ym===m);return`<td>${xs.length?xs.map(x=>x.adm+" / "+x.pd).join(" + "):"—"}</td>`}).join("")}</tr>`).join("")}</tbody></table></div><div class="hint">Values: admissions / patient days</div></details></div>`}
function analyseWb(wb,file){const R={file,daily:[],bedSheets:[],master:[],monthly:[],mmap:{},skipped:[],map:{},masterSheet:"",dailySheet:""};
  wb.SheetNames.forEach(sn=>{const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});if(!A.length){R.skipped.push(sn);return}
    if(parsePD211(A,R,sn))return;
    let hi=-1;for(let i=0;i<Math.min(6,A.length);i++){const h=A[i].map(x=>String(x).trim().toUpperCase());if(h.includes("DATE")||h[0]==="TARIKH"||(h[0]==="MONTH"&&h.some(x=>x.startsWith("PATIENT NAME")))){hi=i;break}}
    if(hi<0||!A[hi].some(x=>/BED|WAD|PATIENT/i.test(String(x)))){const T=transposed(A);if(T){T.sheet=sn;T.ward=T.auto=wardCode(sn);R.bedSheets.push(T);return}if(hi<0){R.skipped.push(sn);return}}
    const H=A[hi].map(x=>String(x).replace(/\s+/g," ").trim().toUpperCase());
    if(H[0]==="MONTH"&&H.some(x=>x.startsWith("PATIENT NAME"))){R.masterSheet=sn;parseMaster(A.slice(hi+1),R,A[hi]);return}
    if(H.some(h=>/^WA(R)?D\s*\/\s*UNIT/.test(h))&&H.includes("MRSA")){R.dailySheet=sn;parseDaily(A.slice(hi+1),H,R);return}
    const bc=H.map((h,j)=>j>0&&/^(BED\b|ISO\b|R\d|CTG)/.test(h)?j:-1).filter(j=>j>0);
    if((H[0]==="DATE"||H[0]==="TARIKH")&&bc.length>=3){const cells=[];A.slice(hi+1).forEach(r=>{const d=okDate(toYmd(r[0]));if(d)bc.forEach(j=>{const v=String(r[j]??"").trim();if(v)cells.push([d,String(A[hi][j]),v])})});
      R.bedSheets.push({sheet:sn,ward:wardCode(sn),auto:wardCode(sn),cells});return}
    R.skipped.push(sn)});
  const ds=R.daily.map(d=>d.date).sort();R.dMin=ds[0];R.dMax=ds[ds.length-1];return R}
/* "RVD: 2, HEP B : 1,HEP C : 1" / "TB SPINE :1" / "RVD-1" / "hep c:1" -> {RVD:2,"HEP B":1,"HEP C":1} */
function parseOthers(v){const m={};String(v||"").replace(/(\d)\s*\)?\s+(?=[A-Z])/gi,"$1,").split(/[,\n\/&]+|\s+DAN\s+/i).forEach(p=>{p=p.trim();if(!p||!/[A-Z]/i.test(p))return;const x=/^COVID|^H\dN\d$/i.test(p)?null:p.match(/^(.*?)(?:[\s:;=\-x×]+\(?|\()(\d+)\)?\s*$/i);let k=(x?x[1]:p).replace(/[\s:;=\-]+$/,"").trim().toUpperCase().replace(/\s+/g," ");const n=x?+x[2]:1;if(!k)return;m[k]=(m[k]||0)+n});return m}
function parseDaily(rows,H,R){const ix=k=>H.indexOf(k),sw=k=>H.findIndex(h=>h.startsWith(k));
  const iD=ix("DATE"),iW=H.findIndex(h=>/^WA(R)?D\s*\/\s*UNIT/.test(h)),iA=sw("TOTAL ADMISSION"),iT=sw("TOTAL TRANSFER IN"),iR=ix("REMARKS");
  const iC=Object.fromEntries(JCOLS.map(k=>[k,ix(k)]));const iV={cvl:ix("CVL"),trachy:ix("TRACHY"),vent:ix("VENTILATOR"),cbd:ix("CBD/SPC")};
  rows.forEach(r=>{const date=okDate(toYmd(r[iD]),R);const label=String(r[iW]??"").trim();if(!date||!label)return;const code=wardCode(label);if(!code)R.map[label]=R.map[label]||"";
    const o={date,label,code,adm:num(r[iA]),tin:num(r[iT]),pd:null,c:{},remarks:iR>=0?String(r[iR]||"").trim():""};
    JCOLS.forEach(k=>{const v=iC[k]>=0?r[iC[k]]:0;o.c[k]=num(v);if(k==="OTHERS"&&typeof v==="string"&&/[A-Z]/i.test(v)){o.oth=parseOthers(v);o.c.OTHERS=Math.max(o.c.OTHERS||0,Object.values(o.oth).reduce((a,b)=>a+b,0));o.remarks=[o.remarks,v.trim()].filter(Boolean).join(" · ")}});
    Object.entries(iV).forEach(([k,i])=>o[k]=i>=0?num(r[i]):0);R.daily.push(o)})}
function parseMaster(rows,R,hdr){const H=hdr.map(x=>String(x||"").split("\n")[0].replace(/\s+/g," ").trim().toUpperCase());const idx={};
  H.forEach((h,j)=>{const k=Object.keys(ALIAS).find(k=>ALIAS[k].some(a=>a==="RN"?h==="RN":h.startsWith(a)));if(k&&idx[k]===undefined)idx[k]=j});R.mcols=Object.keys(idx).length;R.mnew=idx.ward_adm!==undefined;
  rows.forEach(r=>{const name=String(r[idx.name]??"").trim();if(!name||/^TEST PATIENT$/i.test(name)||r.some(v=>String(v??"").trim().toLowerCase()==="example"))return;
  const o={id:uid("K"),imp:true};COLS.forEach(([k,,,t])=>{const v=idx[k]!==undefined?r[idx[k]]:"";if(t==="date")o[k]=toYmd(v);else if(t==="chk")o[k]=String(v).toUpperCase()==="TRUE";else o[k]=strv(v,k)});
  o.name=o.name.toUpperCase();o.bed=String(o.bed||"").replace(/\.0$/,"");const st=SUBTYPES.find(s=>s.toUpperCase()===String(o.subtype).toUpperCase());if(st)o.subtype=st;
  o.group=GROUP[o.subtype]||o.group;o.month=o.sample_date?MONTHS[+o.sample_date.slice(5,7)-1]:String(o.month||"").trim();if(!o.sample_date)o.sample_date="";if(!o.lab_date)o.lab_date="";
  o.tag=o.sample_date&&o.sample_date>=addDays(TODAY,-180)?"Aktif":"Clearance";R.master.push(o)})}

  ${R.jkns&&!R.daily.length&&!R.bedSheets.length&&!R.master.length&&!R.monthly.length?"":!R.daily.length&&!R.bedSheets.length&&!R.master.length&&!R.monthly.length?`<div class="banner warn">${svg("list")}<div>No recognised sheets in this file.</div></div>`:`<label class="imph" style="font-weight:600"><input type="checkbox" id="impSyn"${R.daily.length||R.master.length?" checked":""}> Remove sample (dummy) data from Analysis${R.master.length?" and Masterlist":""}</label>

function applyImport(){const R=IMP;const on=id=>$(id)&&$(id).checked;let nD=0,nB=0,nM=0,nP=0;
  if(on("impP")){const K={};R.monthly.forEach(x=>{const code=x.code||R.mmap[x.label]||String(x.label||"").replace(/^WA[DR]D?\s+/i,"").trim().toUpperCase();if(!code)return;const k=code+"|"+x.ym;if(K[k]){["beds_rasmi","beds_op","adm","pd","disc","deaths","trans_out"].forEach(f=>K[k][f]+=x[f])}else K[k]={...x,ward:code}});
    MONTHLY=MONTHLY.filter(m=>!K[m.ward+"|"+m.ym]);Object.values(K).forEach(v=>{MONTHLY.push(v);nP++})}

      if(K[k]){const a=K[k];a.adm+=d.adm;a.tin+=d.tin;["cvl","trachy","vent","cbd"].forEach(x=>a[x]+=d[x]);JCOLS.forEach(x=>a.c[x]+=d.c[x]);if(d.oth){a.oth=a.oth||{};Object.entries(d.oth).forEach(([k,v])=>a.oth[k]=(a.oth[k]||0)+v)}if(d.remarks)a.remarks=[a.remarks,d.remarks].filter(Boolean).join(" · ")}
      else K[k]={date:d.date,ward:code,adm:d.adm,tin:d.tin,pd:null,cvl:d.cvl,trachy:d.trachy,vent:d.vent,cbd:d.cbd,c:{...d.c},oth:d.oth?{...d.oth}:undefined,remarks:d.remarks,src:"import"}});
    HIST=HIST.filter(h=>!K[h.ward+"|"+h.date]);Object.values(K).forEach(r=>{HIST.push(r);nD++})}
  if(on("impB"))R.bedSheets.forEach(s=>{if(!s.ward)return;s.cells.forEach(([d,h,v])=>{const bed=matchBed(s.ward,h);const k=s.ward+"|"+d;(BEDHIST[k]=BEDHIST[k]||{})[bed]=tagsOf(v);nB++})});
  let nF=0;window._pullUsed=new Set();window._pullUpd=0;if(on("impM"))R.master.forEach(o=>{if(isFinal(o.sample_date)){nF++;return}{const m=pullMerge(o);if(m==="upd"){window._pullUpd=(window._pullUpd||0)+1;return}if(m)return}CASES.push(o);nM++});

  toast(`Saved: ${nP?nP+" monthly ward statistics (PD211), ":""}${nD.toLocaleString()} daily totals, ${nB.toLocaleString()} bed statuses, ${nM} masterlist cases${nF?` (${nF} cases in JKNS-finalized months skipped)`:""}.`);

function edInit(){const ex=censusOf(S.ward,TODAY);let rows=ex?ex.rows.map(r=>({...r,inf:[...(r.inf||[])],dev:[...(r.dev||[])],mw:[...(r.mw||[])]})):[];

/* send to doctor via WhatsApp */
function waNum(p){let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="6"+d;if(!d.startsWith("60")&&d.length<=10)d="60"+d;return d}
function initials(n){return normN(n).split(" ").filter(Boolean).map(w=>w[0]).join("")}
function formLink(c){return`https://script.google.com/macros/s/…/exec?f=${c.fw.token}`}
function waText(c,remind){return`${remind?"Reminder: ":""}Greetings ${(d=>!d?"Dr":/^dr\b/i.test(d)?d:"Dr "+d)((c.fw.dr||"").trim())}, please complete the MDRO Surveillance Form (MDRO/MOH/2022/1) for patient ${initials(c.name)} / RN ${c.rn}, ${c.subtype} (${c.spec}), ${c.ward}${c.bed?" bed "+c.bed:""}.\n\nFill in directly here: ${formLink(c)}\n\nThank you. ${S.staff||S.icn} (${S.ward||"UKI"})`}
function openSend(id,remind){const c=CASES.find(x=>x.id===id);c.fw=c.fw||{status:"none",token:uid("F").slice(1)+uid("").slice(0,4)};const fw=c.fw;
  openModal(`<div class="m-head"><div class="hx"><h3>${remind?"Remind doctor":"Send form to the doctor"}</h3><p>${esc(c.name)} · ${esc(c.subtype)} · ${esc(c.ward)}${c.bed?" bed "+esc(c.bed):""}</p></div>${xBtn()}</div>
  <div class="m-body">
   <div class="mrow"><div class="fld"><label for="sdDr">Doctor's name</label><input id="sdDr" value="${esc(fw.dr||"")}" placeholder="e.g. Dr Amir"></div>
    <div class="fld"><label for="sdPh">Phone no. (WhatsApp)</label><input id="sdPh" type="tel" inputmode="tel" value="${esc(fw.phone||"")}" placeholder="e.g. 012-345 6789"></div></div>
   <div class="fld" style="margin:0"><label for="sdMsg">Message</label><textarea id="sdMsg" rows="7"></textarea></div>
   <div class="hint" style="margin:0">The message contains only the name initials and RN, not the full name. The link opens the form for this patient only; the doctor does not need to log in.</div>
   <div class="banner info">${svg("form")}<div>In this preview the link is not active yet. Use <b>Doctor view</b> to see what the doctor sees. In the real app, the link opens the Google Apps Script form.</div></div>
  </div>
  <div class="m-foot"><button class="btn btn-ghost" onclick="openDoctor('${id}')">Doctor view</button><span class="sp"></span><button class="btn btn-ghost" onclick="copyMsg()">Copy message</button><a class="btn btn-pri" id="sdWa" href="#" target="_blank" rel="noopener" onclick="return markSent('${id}',${!!remind})">${svg("move")}Send WhatsApp</a></div>`,true);
  const upd=()=>{fw.dr=$("sdDr").value.trim();$("sdMsg").value=waText(c,remind);$("sdWa").href=`https://wa.me/${waNum($("sdPh").value)}?text=${encodeURIComponent($("sdMsg").value)}`};
  ["sdDr","sdPh"].forEach(i=>$(i).addEventListener("input",upd));$("sdMsg").addEventListener("input",()=>{$("sdWa").href=`https://wa.me/${waNum($("sdPh").value)}?text=${encodeURIComponent($("sdMsg").value)}`});upd()}
function copyMsg(){const t=$("sdMsg");t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Message copied."),()=>toast("Press Ctrl+C to copy."))}catch(e){toast("Press Ctrl+C to copy.")}}
function markSent(id,remind){const ph=$("sdPh").value.trim();if(waNum(ph).length<10){toast("Enter a valid doctor's phone number.");return false}
  const c=CASES.find(x=>x.id===id);Object.assign(c.fw,{dr:$("sdDr").value.trim(),phone:ph,status:c.fw.status==="filled"?"filled":"sent",sentBy:S.staff||S.icn});
  if(remind)c.fw.remind=(c.fw.remind||0)+1;else c.fw.sentAt=Date.now();setTimeout(()=>{closeModal();toast(remind?"Reminder sent.":"Form sent to "+(c.fw.dr||"doctor")+". Status: Awaiting doctor.");refresh()},300);return true}

  const devs=(F.devs||((row&&row.dev)||[]).map(x=>({d:x==="CBD/SPC"?"CBD / SPC":x,t:""}))).slice();while(devs.length<5)devs.push({});

    <div class="fld"><label for="nf_adm">6. Date of admission</label><input id="nf_adm" type="date" value="${v("adm",c.adm_date)}"${d}></div>
    <div class="fld"><label for="nf_wadm">7. Ward on admission</label><input id="nf_wadm" value="${v("wadm",c.ward_adm||c.ward)}"${d}></div>

    <div class="fld full"><label for="nf_dx">9. Diagnosis on admission</label><input id="nf_dx" value="${v("dx",c.diag_adm)}"${d}></div>
    <div class="fld full"><label>10. Previous encounter to health facility / long term nursing care / dialysis care</label><div class="opts">${rad("nf_prev","Yes","Yes",F.prev||"",ro)}${rad("nf_prev","No","No",F.prev||"",ro)}</div></div>
    <div class="fld nf-prevx full"><label for="nf_prevfac">11. Name of health facility / long term nursing care / dialysis care</label><input id="nf_prevfac" value="${v("prevfac")}"${d}></div>

    <div class="fld full"><label for="nf_stype">Type of operation</label><input id="nf_stype" value="${v("stype")}"${d}></div>
   </div>
   <div class="lbl" style="margin-top:12px">If patient on device</div>
   <div class="tbl-wrap"><table class="abx"><thead><tr><th>#</th><th>Device</th><th>Date of insertion</th></tr></thead><tbody>${devs.map((x,i)=>`<tr><td class="mono">${i+1}</td><td><input class="dv_d" aria-label="Device ${i+1}" value="${esc(x.d)}"${d}></td><td><input class="dv_t" type="date" aria-label="Date of insertion ${i+1}" value="${esc(x.t)}"${d}></td></tr>`).join("")}</tbody></table></div></fieldset>
   <fieldset><legend>B. Positive culture</legend><div class="fg">

    <div class="nf-bsi"><div class="lbl" style="margin-top:12px">If BSI</div><div class="opts">${["CLABSI","Non-CLABSI","Non-CABSI"].map(x=>rad("nf_bsic",x,{CLABSI:"Central Line Associated BSI (CLABSI)","Non-CLABSI":"Non Central Line Associated BSI (Non-CLABSI)","Non-CABSI":"Non Catheter Associated BSI (Non-CABSI)"}[x],F.bsic||"",ro)).join("")}</div>
     <div class="opts">${rad("nf_bsip","Primary","Primary BSI",F.bsip||"",ro)}${rad("nf_bsip","Secondary","Secondary BSI",F.bsip||"",ro)}</div></div></fieldset>
   <fieldset class="nf-F"><legend>F. Culture positive status</legend><div class="opts col">${HA_S.map((lb,i)=>rad("nf_ha",i,`${i+1}. ${lb}`,F.ha??(c.hai==="NOT HCAI"?"3":c.hai==="HAI - other facility"?"1":c.hai==="HAI - own hospital"?"0":""),ro)).join("")}</div></fieldset>
   <fieldset class="nf-F"><legend>G. Antibiotic(s) exposure within last 3 months</legend><div class="tbl-wrap"><table class="abx"><thead><tr><th>No.</th><th>Name of antibiotic</th><th>Group of antibiotic</th><th>Date started</th><th>Duration (days)</th></tr></thead><tbody>
    ${abx.map((a,i)=>`<tr><td class="mono">${i+1}</td><td><input class="ab_n" aria-label="Antibiotic ${i+1}" value="${esc(a.n)}"${d}></td><td><input class="ab_g" aria-label="Group ${i+1}" value="${esc(a.g)}"${d}></td><td><input class="ab_s" type="date" aria-label="Date started ${i+1}" value="${esc(a.s)}"${d}></td><td><input class="ab_d" type="number" inputmode="numeric" aria-label="Duration ${i+1}" value="${esc(a.dur)}"${d}></td></tr>`).join("")}</tbody></table></div></fieldset>

   <fieldset class="nf-H"><legend>I. Outcome data at one month of diagnosis (HA-MDRO bacteraemia)</legend><div class="opts">${rad("nf_out","Alive","1. Alive",F.out||"",ro)}${rad("nf_out","Died","2. Died",F.out||"",ro)}</div>
    <div class="fld nf-died"><label>Death related to HA-MDRO bacteraemia</label><div class="opts">${rad("nf_drel","Yes","Yes",F.drel||"",ro)}${rad("nf_drel","No","No",F.drel||"",ro)}</div></div>

function nfT(){const f=$("mf");if(!f)return;const val=n=>{const r=f.querySelector(`input[name="${n}"]:checked`);return r?r.value:""};const iso=val("nf_iso"),inf=val("nf_inf");

  f.querySelectorAll(".nf-H").forEach(e=>e.hidden=!(iso==="1"&&inf==="0"));f.querySelectorAll(".nf-bsi").forEach(e=>e.hidden=inf!=="0");f.querySelectorAll(".nf-died").forEach(e=>e.hidden=val("nf_out")!=="Died");
  $("nf_orgx").hidden=val("nf_org")!=="7";$("nf_infx").hidden=inf!=="7"}
function readForm(){const f=$("mf");const val=n=>{const r=f.querySelector(`input[name="${n}"]:checked`);return r?r.value:""};const g=k=>$(k).value.trim();
  return{date:TODAY,name:g("nf_name"),mrn:g("nf_mrn"),ic:g("nf_ic"),age:g("nf_age"),sex:$("nf_sex").value,adm:g("nf_adm"),wadm:g("nf_wadm"),dept:g("nf_dept"),dx:g("nf_dx"),prev:val("nf_prev"),prevfac:g("nf_prevfac"),prevdate:g("nf_prevdate"),sdate:g("nf_sdate"),stype:g("nf_stype"),
   devs:[...f.querySelectorAll(".dv_d")].map((e,i)=>({d:e.value.trim(),t:f.querySelectorAll(".dv_t")[i].value})).filter(x=>x.d),
   dxspec:g("nf_dxspec"),indic:g("nf_indic"),sd:g("nf_sd"),spec:g("nf_spec"),pos:g("nf_pos"),loc:g("nf_loc"),org:val("nf_org"),orgx:g("nf_orgx"),iso:val("nf_iso"),inf:val("nf_inf"),infx:g("nf_infx"),bsic:val("nf_bsic"),bsip:val("nf_bsip"),ha:val("nf_ha"),
   abx:[...f.querySelectorAll("table.abx tbody tr")].filter(t=>t.querySelector(".ab_n")).map(t=>({n:t.querySelector(".ab_n").value,g:t.querySelector(".ab_g").value,s:t.querySelector(".ab_s").value,dur:t.querySelector(".ab_d").value})).filter(a=>a.n),
   habsi:val("nf_habsi"),out:val("nf_out"),drel:val("nf_drel"),by:g("nf_by"),bydes:g("nf_bydes"),bydate:g("nf_bydate"),vname:g("nf_vname"),vdes:g("nf_vdes"),vdate:g("nf_vdate")}}
function checkForm(F){const miss=[];if(!F.age)miss.push("A4 Age");if(!F.sex)miss.push("A5 Gender");if(!F.dx)miss.push("A9 Diagnosis on admission");if(!F.prev)miss.push("A10 Previous encounter to health facility (Yes / No)");if(!F.dxspec)miss.push("B1 Diagnosis on specimen taken");if(!F.iso)miss.push("D Isolate status");
  if(F.iso==="1"&&F.inf==="")miss.push("E Type of infection");if(F.iso!=="3"&&F.ha==="")miss.push("F Culture positive status");if(!F.by)miss.push("Prepared by: name");if(!F.vname)miss.push("Verified by: treating specialist name");return miss}
function syncForm(c,F){const set=(k,v)=>{if(v!==undefined&&v!==null&&String(v).trim()!==""&&!String(c[k]||"").trim())c[k]=v};
  set("prev_enc",F.prev==="Yes"?"YES":F.prev==="No"?"NO":"");set("prev_fac",F.prevfac);set("prev_date",F.prevdate);const ab=(F.abx||[]).filter(a=>a.n);set("abx1",ab[0]&&ab[0].n);set("abx2",ab[1]&&ab[1].n);
  set("ward_adm",matchWard(F.wadm));set("adm_date",F.adm);set("diag_adm",F.dx);set("diag_spec",F.dxspec);set("clabsi",F.bsic==="CLABSI"?"CLABSI":F.bsic?"NON-CLABSI":"");set("death_rel",F.drel==="Yes"?"YES":F.drel==="No"?"NO":"")}
function matchWard(t){const u=String(t||"").trim();if(!u)return"";const f=ALL_LOC.find(w=>w.toUpperCase()===u.toUpperCase());return f||wardFromClinic(u)||u}
function applyCls(c,F){syncForm(c,F);if(F.iso==="3"){c.hai="CONTAMINATION";c.infcol=""}else{c.infcol=F.iso==="2"?"COLONIZER":F.iso==="1"?"INFECTION":c.infcol;const h=["HAI - own hospital","HAI - other facility","HAI - other facility","NOT HCAI"][+F.ha];if(F.ha!==""&&h&&!c.hai)c.hai=h}
  if(F.iso==="1"&&F.inf==="0"){c.pbsi=F.bsip==="Primary"?"YES":F.bsip==="Secondary"?"NO":c.pbsi;if(F.ha==="0")c.habsi="YES"}}
/* ward / UKI modal: mode = fill | verify | view */

function showMissing(miss){openModal(`<div class="m-head"><div class="hx"><h3>Please fill in</h3><p>The form cannot be submitted yet. ${miss.length} item${miss.length>1?"s are":" is"} still empty:</p></div>${xBtn()}</div>
  <div class="m-body"><ul class="misslist">${miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div><div class="m-foot"><span class="sp"></span><button class="btn btn-pri" onclick="closeModal()">OK, fill in now</button></div>`)}
function submitForm(id){const c=CASES.find(x=>x.id===id);const F=readForm();const miss=checkForm(F);if(miss.length){toast("Incomplete: "+miss.join(", "));return}
  c.form={...(c.form||{}),...F};c.fw=c.fw||{token:uid("F")};c.fw.status="verified";c.fw.filledAt=c.fw.verifiedAt=Date.now();c.form_done="YES";applyCls(c,F);
  closeModal();toast("Form saved and complete (verified by "+F.vname+").");refresh()}
function verifyForm(id){const c=CASES.find(x=>x.id===id);const n=$("vf_name").value.trim();if(!n){toast("Enter your name (checked by).");return}
  const vn=$("nf_vname")?$("nf_vname").value.trim():(c.form||{}).vname;if(!vn){toast("The treating specialist (Verified by) is empty. Return to the doctor, or ask UKI to correct.");return}
  c.form={...(c.form||{}),ckname:n,ckdes:$("vf_des").value.trim(),ckdate:$("vf_date").value};c.form_done="YES";c.fw=c.fw||{};c.fw.status="verified";c.fw.verifiedAt=Date.now();
  closeModal();toast("Form verified. MASTERLIST: MDRO FORM COMPLETED & REVIEWED = YES.");refresh()}
function returnForm(id){const c=CASES.find(x=>x.id===id);c.fw.status="sent";closeModal();toast("Form returned to the doctor. Tap Remind to resend the link.");refresh()}

/* doctor view (opened from WhatsApp link, no login) */
function openDoctor(id){const c=CASES.find(x=>x.id===id);c.fw=c.fw||{status:"none",token:uid("F")};S.docMode=id;closeModal();
  $("app").hidden=true;$("login").hidden=true;const v=$("docView");v.hidden=false;window.scrollTo(0,0);
  if(fstat(c)==="filled"||fstat(c)==="verified"){v.innerHTML=docShell(c,`<div class="panel pad doc-done"><h2>Form already sent</h2><p>Thank you. The form for this patient has been received by ward ${esc(c.ward)}.</p></div>`);return}
  v.innerHTML=docShell(c,`<div class="banner info">${svg("form")}<div>Please complete the form below. Patient and lab details have been filled in by UKI. The app will tell you if any mandatory section is incomplete.</div></div>
   <div class="panel pad">${formBody(c,false)}</div>
   <div class="doc-act"><button class="btn btn-pri btn-block" onclick="docSubmit('${id}')">Submit form</button></div>`);nfT()}

(function(){let D=null,moved=false;const skip=t=>t.closest("button,a,input,select,textarea,label,canvas,[contenteditable],[data-pb],#stage,.sbar,.tabs");
  const hs=el=>{for(let n=el;n&&n!==document.body&&n.nodeType===1;n=n.parentElement){if(n.scrollWidth>n.clientWidth+2){const o=getComputedStyle(n).overflowX;if(o==="auto"||o==="scroll")return n}}return null};
  let last=null;document.addEventListener("mouseover",e=>{if(D)return;const w=e.target.nodeType===1&&!skip(e.target)?hs(e.target):null;if(last&&last!==w)last.classList.remove("canDrag");if(w)w.classList.add("canDrag");last=w});
  document.addEventListener("mousedown",e=>{if(e.button!==0||e.target.nodeType!==1||skip(e.target))return;const w=hs(e.target);if(!w)return;
    const sc=w.closest(".modal")||null;D={w,x:e.clientX,y:e.clientY,sl:w.scrollLeft,sc,st:sc?sc.scrollTop:window.scrollY};moved=false;w.classList.add("dragging");e.preventDefault()});
  document.addEventListener("mousemove",e=>{if(!D)return;const dx=e.clientX-D.x,dy=e.clientY-D.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;D.w.scrollLeft=D.sl-dx;if(D.sc)D.sc.scrollTop=D.st-dy;else window.scrollTo(window.scrollX,D.st-dy)});
  document.addEventListener("mouseup",()=>{if(!D)return;D.w.classList.remove("dragging");D=null});
  document.addEventListener("click",e=>{if(moved){moved=false;e.stopPropagation();e.preventDefault()}},true)})();

  OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function add(){document.querySelectorAll('input[type="password"],input[data-pw]').forEach(i=>{if(i.parentNode&&i.parentNode.classList&&i.parentNode.classList.contains("pwwrap"))return;i.setAttribute("data-pw","1");
    const w=document.createElement("span");w.className="pwwrap";i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement("button");b.type="button";b.className="pweye";b.setAttribute("aria-label","Show password");b.innerHTML=EYE;w.appendChild(b)})}
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".pweye");if(!b)return;e.preventDefault();const i=b.parentNode.querySelector("input");if(!i)return;const show=i.type==="password";i.type=show?"text":"password";b.innerHTML=show?OFF:EYE;b.setAttribute("aria-label",show?"Hide password":"Show password");i.focus()});
  add();new MutationObserver(add).observe(document.body,{childList:true,subtree:true})})();

async function saveLinks(){const o={auto:$("lk_auto").checked};Object.keys(LINK_L).forEach(k=>o[k]=$("lk_"+k).value.trim());toast("Checking links…");

function wbFromPull(d){if(d.xlsx)return XLSX.read(d.xlsx,{type:"base64",cellDates:false});const wb={SheetNames:[],Sheets:{}};d.sheets.forEach(s=>{wb.SheetNames.push(s.name);wb.Sheets[s.name]=XLSX.utils.aoa_to_sheet(s.v.length?s.v:[[""]])});return wb}
async function pullLinked(kind){if(!$("impRes")){openImport()}$("impRes").innerHTML=`<div class="banner info">${svg("up")}<div>Pulling <b>${esc(LINK_L[kind])}</b> from Google Sheets… this can take up to a minute for large sheets.</div></div>`;

/* daily totals (JUMLAH sheet) -> history, for days the ward did not submit in the app */
function mergeDaily(R,from){const K={};let n=0;R.daily.forEach(d=>{const code=d.code||R.map[d.label];if(!code||(from&&d.date<from))return;const k=code+"|"+d.date;
    if(K[k]){const a=K[k];a.adm+=d.adm;a.tin+=d.tin;["cvl","trachy","vent","cbd"].forEach(x=>a[x]+=d[x]);JCOLS.forEach(x=>a.c[x]+=d.c[x]);if(d.oth){a.oth=a.oth||{};Object.entries(d.oth).forEach(([k,v])=>a.oth[k]=(a.oth[k]||0)+v)}if(d.remarks)a.remarks=[a.remarks,d.remarks].filter(Boolean).join(" · ")}
    else K[k]={date:d.date,ward:code,adm:d.adm,tin:d.tin,pd:null,cvl:d.cvl,trachy:d.trachy,vent:d.vent,cbd:d.cbd,c:{...d.c},oth:d.oth?{...d.oth}:undefined,remarks:d.remarks,src:"import"}});
  const cen=new Set(CENSUS.map(c=>c.ward+"|"+c.date));
  Object.entries(K).forEach(([k,r])=>{if(cen.has(k))return;const i=HIST.findIndex(h=>h.ward+"|"+h.date===k);if(r.oth===undefined)delete r.oth;
    if(i>=0){const h=HIST[i];const st=o=>JSON.stringify(Object.entries(o).filter(([k,v])=>k!=="id"&&v!==undefined).sort());if(h._d||st(h)===st(r))return;if(h.src!=="import"&&!h.syn)return;r.id=h.id;HIST[i]=r}else HIST.push(r);n++});return n}
/* bed sheets (DATE + BED 1… / R1/1…) -> bed status for days without an app census */
function mergeBeds(R,from){const cen=new Set(CENSUS.map(c=>c.ward+"|"+c.date));const N={};
  R.bedSheets.forEach(sh=>{if(!sh.ward||!WCFG[sh.ward])return;sh.cells.forEach(([d,h,v])=>{if(from&&d<from)return;const k=sh.ward+"|"+d;if(cen.has(k))return;(N[k]=N[k]||{})[matchBed(sh.ward,h)]=tagsOf(v)})});
  let n=0;Object.entries(N).forEach(([k,o])=>{if(JSON.stringify(BEDHIST[k]||{})===JSON.stringify(o))return;BEDHIST[k]=o;n++});return n}
async function autoPullCensus(L){if(!L.census||!L.census.url)return;
  try{if(window.LAZY)await window.LAZY;const d=await GS("pullSheet",TOKEN,"census",{only:"jumlah",year:YEAR});const R=analyseWb(wbFromPull(d),d.name);const n=mergeDaily(R,YEAR+"-01-01");const nb=mergeBeds(R,YEAR+"-01-01");
    if(n||nb){IMPORTS.unshift({at:Date.now(),file:d.name+" (auto-pull)",by:S.icn,nD:n,nB:nb,nM:0,nP:0});refresh()}toast(n||nb?`Census harian: ${n} daily ward totals and ${nb} ward-days of bed status updated.`:`Census harian checked · nothing new.`)}catch(e){toast("Census auto-pull failed: "+(e.message||e))}}
async function autoPullLab(){if(S._autoPulled||!liveOK()||S.role!=="uki")return;S._autoPulled=1;{const nd=dedupeCases();if(nd){toast(`${nd} duplicate copies of the same lab result removed from the masterlist.`);refresh()}}const L=await loadLinks();if(!L||!L.auto)return;setTimeout(()=>autoPullCensus(L),8000);await pullLab(L)}
/* "Update from sheets" button: pull LAB_SURVEILLANCE + census harian now, without reloading the app */
async function syncSheets(btn){if(!liveOK()){toast("Available in the live app (linked Google Sheets).");return}if(window._syncing)return;window._syncing=1;
  const b=btn||$("syncBtn");const old=b?b.innerHTML:"";if(b){b.disabled=true;b.innerHTML='<span class="spin"></span><span>Updating…</span>'}
  try{const L=await loadLinks();if(!L||(!(L.lab&&L.lab.url)&&!(L.census&&L.census.url))){toast("No Google Sheet linked yet. Link LAB_SURVEILLANCE / census in Import → Link Google Sheets.");return}
    {const nd=dedupeCases();if(nd)toast(`${nd} duplicate copies removed.`)}
    if(L.lab&&L.lab.url)await pullLab(L);if(L.census&&L.census.url)await autoPullCensus(L);refresh()}
  finally{window._syncing=0;if(b&&b.isConnected){b.disabled=false;b.innerHTML=old}}}
async function pullLab(L){if(!L.lab||!L.lab.url)return;
  try{const d=await GS("pullSheet",TOKEN,"lab");const R=analyseWb(wbFromPull(d),d.name);let n=0,f=0;
    window._pullUpd=0;window._pullUsed=new Set();R.master.forEach(o=>{if(isFinal(o.sample_date)){f++;return}{const m=pullMerge(o);if(m==="upd"){window._pullUpd=(window._pullUpd||0)+1;return}if(m)return}CASES.push(o);n++});
    const u=window._pullUpd||0;window._pullUpd=0;if(n||u){IMPORTS.unshift({at:Date.now(),file:d.name+" (auto-pull)",by:S.icn,nD:0,nB:0,nM:n,nP:0});refresh()}toast(n||u?`LAB_SURVEILLANCE: ${n} new cases, ${u} cases updated from changes in the sheet.`:`LAB_SURVEILLANCE checked · no changes.`)}catch(e){toast("LAB_SURVEILLANCE pull failed: "+(e.message||e))}}

function kpiInfo(k){const{M}=aggMonth();const sm=S.an.month;const o=sm===-1?sumMons(M):fullYear(M)[sm];const scope=`${S.an.ward||"All wards"} · ${monLbl(sm)}${sm===-1?"":" "+YEAR}${orgLbl()?" · "+orgLbl():""}`;const f=(a,d=2)=>Number(a||0).toFixed(d);const n=v=>Number(v||0).toLocaleString();
  const srcAdm=`<b>PD211</b> (monthly ward statistics) when imported for that month; otherwise the total of <b>new admissions</b> in each ward's daily census.`;
