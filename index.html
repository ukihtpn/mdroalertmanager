   notified:["Notified (NEW)",`Count of NEW cases in the masterlist`,`= <b>${o.notified}</b>`,`All NEW cases by sample date for the filters selected (any classification). REPEAT cases are not counted.`],
   own:["HAI this hospital",`Infection (HAI own hospital) + Colonization (HAI own hospital)`,`${o.k.INF} + ${o.k.COL} = <b>${o.k.INF+o.k.COL}</b> → ${o.k.INF+o.k.COL} ÷ ${n(o.adm)} × 100 = <b>${o.adm?f((o.k.INF+o.k.COL)/o.adm*100):"—"}</b> per 100`,`From masterlist columns <i>HAI = HAI - own hospital</i> and <i>INFECTION vs COLONIZER</i>.`],
   other:["HAI other MOH / hospital",`Cases with HAI = HAI - other facility`,`= <b>${o.k.OTHER}</b> → ${o.k.OTHER} ÷ ${n(o.adm)} × 100 = <b>${o.adm?f(o.k.OTHER/o.adm*100):"—"}</b> per 100`,`Acquired at another MOH facility or private hospital, detected here.`],
   comm:["Community (not HCAI)",`Cases with HAI = NOT HCAI`,`= <b>${o.k.COMM}</b> → ${o.k.COMM} ÷ ${n(o.adm)} × 100 = <b>${o.adm?f(o.k.COMM/o.adm*100):"—"}</b> per 100`,`Positive within 48 hours of admission with no healthcare exposure.`],
   notcounted:["Not counted",`Awaiting review + contaminant`,`${o.k.UNREV} + ${o.k.CONT} = <b>${o.k.UNREV+o.k.CONT}</b>`,`<b>Awaiting review</b>: HAI or infection/colonizer not filled in yet — classify them so they enter the rate. <b>Contaminant</b> is never counted. REPEAT cases are excluded everywhere.`],
   r1k:["Per 1,000 patient days",`Cases counted ÷ patient days × 1,000`,`${o.cases} ÷ ${n(o.pd)} × 1,000 = <b>${o.pd?f(o.r1k):"—"}</b>`,`Patient days from PD211 (or daily census patient counts). BOR = patient days ÷ (operational beds × days in month) × 100${o.bor!=null?` = <b>${f(o.bor,1)}%</b>`:""}.`],
   pd:["Patient days",`Sum of patient days for the ward(s) and month(s) selected`,`= <b>${o.pd?n(o.pd):"—"}</b> (source: ${esc(o.src)})`,`<b>PD211</b> “Jumlah hari pesakit” when imported; otherwise the number of patients in each daily census (1 patient = 1 day).`],
   cvl:["Central line (CVL) days",`Σ (patients with CVL ticked in each day's census)`,`= <b>${n(o.cvl)}</b> CVL days`,devSrc+` Example: 3 patients with CVL for 5 days = 15 CVL days.`],
   vent:["Ventilator days",`Σ (patients on ventilator ticked in each day's census)`,`= <b>${n(o.vent)}</b> ventilator days${o.pd?` · utilisation ${n(o.vent)} ÷ ${n(o.pd)} = <b>${f(o.vent/o.pd)}</b>`:""}`,devSrc],
   du:["Device utilisation ratio (CVL)",`CVL days ÷ patient days`,`${n(o.cvl)} ÷ ${n(o.pd)} = <b>${o.pd?f(o.du):"—"}</b>`,`Share of patient days with a central line (0.10 = 10% of patient days). CVL days: ${devSrc}`]};
  const x=I[k];if(!x)return;
  openModal(`<div class="m-head"><div class="hx"><h3>${x[0]}</h3><p>${esc(scope)}</p></div>${xBtn()}</div>
   <div class="m-body"><div class="fbox"><div class="lbl" style="margin-top:0">Formula</div><div class="fml">${x[1]}</div><div class="lbl">With the current filters</div><div class="fml">${x[2]}</div></div><div class="lbl">Where the data comes from</div><p style="margin:4px 0 0;line-height:1.55">${x[3]}</p></div>
   <div class="m-foot"><button class="btn btn-pri" onclick="closeModal()">OK</button></div>`)}

/* ================= LIVE · Google Apps Script + Google Sheet ================= */
const LIVE=true;
const GS=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...a));
let TOKEN="";try{TOKEN=sessionStorage.getItem("mdro_tok")||""}catch(e){}
const CENSUS_DAYS=35;
const COLLS={cases:()=>CASES,census:()=>CENSUS,moves:()=>MOVES};
const STORES={monthly:()=>MONTHLY,hist:()=>HIST,imports:()=>IMPORTS,final:()=>FINAL};
let SNAP={},SYNC={busy:false,again:false,timer:null,err:"",last:0},VER=0;
const BLOB=new Map(),REV=new Map();           /* drive id -> dataURL, dataURL -> drive id */

/* ---------- ids & (de)hydration ---------- */
function keyOf(k,o){if(o.id)return o.id;if(k==="monthly")return o.id="P|"+o.ward+"|"+o.ym;if(k==="hist")return o.id="H|"+o.ward+"|"+o.date;return o.id=uid("X")}
const dehydStr=o=>JSON.stringify(o,(k,v)=>typeof v==="string"&&v.length>200&&v.startsWith("data:")&&REV.has(v)?"drive:"+REV.get(v):v);
function bigStrings(o,out){if(!o||typeof o!=="object")return out;for(const k in o){const v=o[k];if(typeof v==="string"){if(v.startsWith("data:")&&v.length>8000&&!REV.has(v))out.push(v)}else if(v&&typeof v==="object")bigStrings(v,out)}return out}
function driveIds(o,out){if(!o||typeof o!=="object")return out;for(const k in o){const v=o[k];if(typeof v==="string"){if(v.startsWith("drive:")&&!BLOB.has(v.slice(6)))out.add(v.slice(6))}else if(v&&typeof v==="object")driveIds(v,out)}return out}
function fillDrive(o){if(!o||typeof o!=="object")return;for(const k in o){const v=o[k];if(typeof v==="string"){if(v.startsWith("drive:")&&BLOB.has(v.slice(6)))o[k]=BLOB.get(v.slice(6))}else if(v&&typeof v==="object")fillDrive(v)}}
/* blob cache on this device (IndexedDB): Drive ids never change, so a cached image is always valid */
let IDBP=null;function idb(){if(IDBP)return IDBP;IDBP=new Promise((res)=>{try{const q=indexedDB.open("mdro_blobs",1);q.onupgradeneeded=()=>q.result.createObjectStore("b");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}});return IDBP}
async function idbGet(ids){const db=await idb();if(!db||!ids.length)return{};return new Promise(res=>{const out={};try{const st=db.transaction("b").objectStore("b");let n=ids.length;ids.forEach(id=>{const r=st.get(id);r.onsuccess=()=>{if(r.result)out[id]=r.result;if(!--n)res(out)};r.onerror=()=>{if(!--n)res(out)}})}catch(e){res(out)}})}
async function idbPut(m){const db=await idb();if(!db)return;try{const st=db.transaction("b","readwrite").objectStore("b");Object.entries(m).forEach(([k,v])=>{if(v)st.put(v,k)})}catch(e){}}
async function hydrate(o,cacheOnly){const ids=[...driveIds(o,new Set())];if(ids.length){const c=await idbGet(ids);Object.entries(c).forEach(([id,d])=>{BLOB.set(id,d);REV.set(d,id)});
    const miss=ids.filter(id=>!c[id]);if(miss.length&&!cacheOnly){const m=await GS("getBlobs",TOKEN,miss);Object.entries(m||{}).forEach(([id,d])=>{if(d){BLOB.set(id,d);REV.set(d,id)}});idbPut(m||{})}}fillDrive(o)}
async function hydrateCase(id){const c=CASES.find(x=>x.id===id);if(!c)return;const P=CASES.filter(x=>same(x,c));const need=P.some(x=>driveIds(x,new Set()).size);if(need)syncSt("Loading attachments…");
  try{await hydrate(P)}catch(e){toast("Attachment could not be loaded: "+e.message)}if(need)syncSt()}

/* ---------- snapshot / diff / sync ---------- */
function snapAll(){SNAP={};Object.entries({...COLLS,...STORES}).forEach(([k,f])=>{SNAP[k]={};f().forEach(o=>{if(o._d)return;SNAP[k][keyOf(k,o)]=dehydStr(o)})});
  SNAP.maps={};Object.entries(MAPS).forEach(([k,v])=>SNAP.maps[k]=dehydStr(v));SNAP.bedhist={};Object.entries(BEDHIST).forEach(([k,v])=>SNAP.bedhist[k]=JSON.stringify(v))}
function diffAll(){const up={cases:[],census:[],moves:[],store:[]},del={cases:[],census:[],moves:[],store:[]};let n=0;
  Object.entries({...COLLS,...STORES}).forEach(([k,f])=>{const cur={};f().forEach(o=>{if(o._d)return;const id=keyOf(k,o);const s=dehydStr(o);cur[id]=1;if(SNAP[k]&&SNAP[k][id]===s)return;n++;
      if(STORES[k])up.store.push({coll:k,id,o});else up[k].push(o)});
    Object.keys(SNAP[k]||{}).forEach(id=>{if(!cur[id]){n++;if(STORES[k])del.store.push(k+"::"+id);else del[k].push(id)}})});
  Object.entries(MAPS).forEach(([k,v])=>{if(SNAP.maps[k]!==dehydStr(v)){n++;up.store.push({coll:"maps",id:k,o:v})}});
  Object.keys(SNAP.maps||{}).forEach(k=>{if(!MAPS[k]){n++;del.store.push("maps::"+k)}});
  Object.entries(BEDHIST).forEach(([k,v])=>{if(SNAP.bedhist[k]!==JSON.stringify(v)){n++;up.store.push({coll:"bedhist",id:k,o:v})}});
  return{up,del,n}}
function syncSoon(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,ms??700)}
async function syncNow(){if(!TOKEN||S.docMode&&!S.role)return;if(SYNC.busy){SYNC.again=true;return}
  const d=diffAll();if(!d.n){syncSt();return}SYNC.busy=true;syncSt("Saving…");
  try{const all=[...d.up.cases,...d.up.census,...d.up.moves,...d.up.store.map(x=>x.o)];const big=[...new Set(bigStrings(all,[]))];
    for(const s of big){const id=await GS("uploadBlob",TOKEN,s);BLOB.set(id,s);REV.set(s,id)}
    const pack={up:{cases:d.up.cases.map(o=>JSON.parse(dehydStr(o))),census:d.up.census.map(o=>{const x=JSON.parse(dehydStr(o));x._t=totalsOf(o);return x}),moves:d.up.moves.map(o=>JSON.parse(dehydStr(o))),
      store:d.up.store.map(x=>({coll:x.coll,id:x.id,o:JSON.parse(x.coll==="maps"?dehydStr(x.o):JSON.stringify(x.o))}))},del:d.del};
    const r=await GS("sync",TOKEN,pack);VER=r.ver||VER;
    d.up.cases.forEach(o=>SNAP.cases[o.id]=dehydStr(o));d.up.census.forEach(o=>SNAP.census[o.id]=dehydStr(o));d.up.moves.forEach(o=>SNAP.moves[o.id]=dehydStr(o));
    d.up.store.forEach(x=>{SNAP[x.coll]=SNAP[x.coll]||{};SNAP[x.coll][x.id]=x.coll==="bedhist"?JSON.stringify(x.o):dehydStr(x.o)});
    ["cases","census","moves"].forEach(k=>d.del[k].forEach(id=>delete SNAP[k][id]));d.del.store.forEach(s=>{const[c,id]=s.split("::");if(SNAP[c])delete SNAP[c][id]});
    SYNC.err="";SYNC.last=Date.now();syncSt("Saved "+fmtT(Date.now()),1)}
  catch(e){SYNC.err=String(e.message||e);if(/SESSION/.test(SYNC.err)){sessionExpired();}else{syncSt("Save failed · try again",2);setTimeout(()=>syncSoon(0),15000)}}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;syncSoon(0)}}}
function syncSt(t,k){let e=document.getElementById("syncSt");if(!e){e=document.createElement("button");e.id="syncSt";e.className="syncst";e.onclick=()=>syncNow();document.body.appendChild(e)}
  if(!t){e.hidden=true;return}e.hidden=false;e.textContent=t;e.dataset.k=k||0;if(k===1)setTimeout(()=>{if(e.textContent===t)e.hidden=true},2500)}
addEventListener("beforeunload",e=>{if(TOKEN&&diffAll().n){syncNow();e.preventDefault();e.returnValue=""}});

/* hook: every render / modal close / toast triggers a debounced save */
(function(){const r=refresh,cm=closeModal,t=toast,g=go;
  window.refresh=function(){r.apply(this,arguments);syncSoon()};window.closeModal=function(){cm.apply(this,arguments);syncSoon()};
  window.toast=function(){t.apply(this,arguments);syncSoon()};window.go=function(){g.apply(this,arguments);syncSoon()}})();

/* ---------- load ---------- */
/* one-time fix: W7 new plan (from 16/10/2026) had bed 42 typed instead of 36 */
function fixW7Bed(){let n=0;CENSUS.forEach(c=>{if(c.ward==="W7"&&c.date>="2026-10-16"&&!(c.rows||[]).some(r=>r.bed==="36"))(c.rows||[]).forEach(r=>{if(r.bed==="42"){r.bed="36";n++}})});if(n)syncSoon()}
function loadAll(d){CASES=d.cases||[];CENSUS=d.census||[];MOVES=d.moves||[];MONTHLY=[];HIST=[];IMPORTS=[];FINAL=[];BEDHIST={};MAPS=JSON.parse(JSON.stringify(PLANS));
  (d.store||[]).forEach(x=>{if(x.coll==="monthly")MONTHLY.push(x.o);else if(x.coll==="hist")HIST.push(x.o);else if(x.coll==="imports")IMPORTS.push(x.o);else if(x.coll==="final")FINAL.push(x.o);else if(x.coll==="bedhist")BEDHIST[x.id]=x.o;else if(x.coll==="maps"){if(!(PLANS[x.id]&&(PLANS[x.id].v||0)>((x.o&&x.o.v)||0)))MAPS[x.id]=x.o}});
  (d.oldTotals||[]).forEach(t=>HIST.push({...t,_d:true}));VER=d.ver||0;
  if(d.icn&&d.icn.length){ICN.length=0;d.icn.forEach(n=>ICN.push(n))}
  snapAll()}
async function boot(user,pre){syncSt("Loading data…");const d=pre||await GS("getAll",TOKEN,CENSUS_DAYS,{lite:user.role==="uki"});loadAll(d);try{await hydrate(MAPS,true)}catch(e){}snapAll();syncSt();fixW7Bed();
  /* floor-plan images not yet on this device: fetch in the background, redraw when ready */
  if(driveIds(MAPS,new Set()).size)hydrate(MAPS).then(()=>{if($("modalBg").hidden&&["mapping","census","wards","dash"].includes(S.tab))refresh()}).catch(()=>{});
  S.role=user.role;if(user.role==="uki"){S.icn=user.name;S.tab="dash"}else{S.ward=user.ward;S.staff=user.staff||user.name;S.tab="census";S.ed=null;S.map.ward=S.ward;S.map.bld=(WCFG[S.ward]||{}).bld||"MB";S.map.edit=false}
  start();clearInterval(window._pollT);window._pollT=setInterval(poll,90000);if(user.role==="uki"&&(d.skipped||[]).length)window.LAZY=loadLazy(d.skipped);if(user.role==="uki")setTimeout(()=>{try{autoPullLab()}catch(e){}},3000)}
async function poll(){if(!TOKEN||SYNC.busy||document.hidden||window._polling)return;window._polling=1;setTimeout(()=>window._polling=0,60000);try{const v=await GS("getVersion");if(v===VER)return;const ch=await GS("getChanges",TOKEN,VER,CENSUS_DAYS);mergeChanges(ch)}catch(e){}finally{window._polling=0}}
function mergeChanges(ch){const local=diffAll();const dirty=new Set([...local.up.cases,...local.up.census,...local.up.moves].map(o=>o.id));let n=0;
  [["cases",CASES],["census",CENSUS],["moves",MOVES]].forEach(([k,A])=>(ch[k]||[]).forEach(o=>{if(dirty.has(o.id))return;const i=A.findIndex(x=>x.id===o.id);if(i>=0)A[i]=o;else A.push(o);SNAP[k][o.id]=dehydStr(o);n++}));
  (ch.store||[]).forEach(x=>{const A=x.coll==="monthly"?MONTHLY:x.coll==="hist"?HIST:x.coll==="imports"?IMPORTS:x.coll==="final"?FINAL:null;if(A){const i=A.findIndex(y=>y.id===x.id);if(i>=0)A[i]=x.o;else A.push(x.o)}else if(x.coll==="bedhist")BEDHIST[x.id]=x.o;else if(x.coll==="maps")MAPS[x.id]=x.o;
    SNAP[x.coll]=SNAP[x.coll]||{};SNAP[x.coll][x.id]=x.coll==="bedhist"?JSON.stringify(x.o):dehydStr(x.o);n++});
  (ch.deleted||[]).forEach(s=>{const[k,id]=s.split("::");const A={cases:CASES,census:CENSUS,moves:MOVES}[k];if(A){const i=A.findIndex(x=>x.id===id);if(i>=0)A.splice(i,1);delete SNAP[k][id];n++}});
  VER=ch.ver||VER;if(n&&S.role&&$("modalBg").hidden&&S.tab!=="register"&&S.tab!=="census")refresh()}

/* ---------- login ---------- */
async function liveLogin(o,errEl){$(errEl).textContent="";syncSt("Logging in…");const st=$(errEl).closest("[id^=lgStep]")||document;const bt=st.querySelector(".btn-pri");const bl=bt?bt.innerHTML:"";if(bt){bt.disabled=true;bt.innerHTML='<span class="spin"></span> Logging in…'}const unb=()=>{if(bt&&bt.isConnected){bt.disabled=false;bt.innerHTML=bl}};
  try{let r=null;try{r=await GS("login",{...o,days:CENSUS_DAYS})}catch(e){if(/LOGIN/.test(e.message||e))throw e;console.warn("login+data failed:",e)}
    if(!r||!r.token){syncSt("Logging in (retry)…");r=await GS("login",o)}   /* fallback: plain login, data loaded after */
    if(!r||!r.token)throw new Error("empty reply from server ("+(window._lastRaw||"")+")");if(!r.user&&r.data&&r.data.user)r.user=r.data.user;if(!r.user)throw new Error("server reply has no user, check that Code.gs is the latest and deployed as a New version");if(r.dataErr){console.warn("login data:",r.dataErr);delete r.data}TOKEN=r.token;syncSt();
    if(r.user.role==="uki"&&(r.user.auditors||[]).length){PREF=r.data?Promise.resolve(r.data):GS("getAll",TOKEN,CENSUS_DAYS,{lite:true}).catch(()=>null);pickAuditor(r.user);return}
    saveSess(r.user);await boot(r.user,r.data)}
  catch(e){syncSt();unb();$(errEl).textContent=/LOGIN/.test(e.message||e)?"Wrong password.":"Error: "+(e.message||e)}}
function saveSess(u){try{sessionStorage.setItem("mdro_tok",TOKEN);sessionStorage.setItem("mdro_user",JSON.stringify(u))}catch(e){}}
function pickAuditor(u){let last="";try{last=localStorage.getItem("mdro_aud")||""}catch(e){}
  $("lgStepU").innerHTML=`<div class="lg-q">Choose officer (auditor)</div><div class="audl">${u.auditors.map(n=>`<button class="btn ${n===last?"btn-pri":"btn-ghost"} btn-block" onclick="chooseAuditor(this)">${esc(n)}</button>`).join("")}</div><div class="err" id="lgErrU"></div>`}
let PREF=null;
window.chooseAuditor=async function(btn){const n=typeof btn==="string"?btn:btn.textContent.trim();
  if(typeof btn!=="string"){document.querySelectorAll(".audl button").forEach(b=>{b.style.pointerEvents="none";b.classList.toggle("audsel",b===btn);b.style.opacity=b===btn?"1":".4"});btn.innerHTML=`<span class="spin"></span> ${esc(n)} · opening…`}
  syncSt("Logging in…");try{const [u,d]=await Promise.all([GS("setAuditor",TOKEN,n),PREF||Promise.resolve(null)]);PREF=null;try{localStorage.setItem("mdro_aud",n)}catch(e){}saveSess(u);await boot(u,d)}
  catch(e){syncSt();document.querySelectorAll(".audl button").forEach(b=>{b.style.pointerEvents="";b.classList.remove("audsel");b.style.opacity="1"});if(typeof btn!=="string")btn.textContent=n;$("lgErrU").textContent="Error: "+(e.message||e)}};
window.loginUki=function(){const u=$("lgUser").value.trim()||"uki",p=$("lgPass").value;if(!p){$("lgErrU").textContent="Enter the password.";return}liveLogin({user:u,pass:p},"lgErrU")};
window.loginWard=function(){const w=$("lgWard").value,p=$("lgWPass").value,n=$("lgWName").value.trim()||("Staff "+w);if(!p){$("lgErrW").textContent="Enter the ward password.";return}try{localStorage.setItem("mdro_ward",w)}catch(e){}liveLogin({ward:w,pass:p,staff:n},"lgErrW")};
let ORIG_U="";const restoreU=()=>{if(ORIG_U){$("lgStepU").innerHTML=ORIG_U;$("lgUser").value="uki";{const f=$("lgUser");if(f&&f.closest(".fld"))f.closest(".fld").hidden=true}const f=$("lgIcn");if(f&&f.closest(".fld"))f.closest(".fld").hidden=true}};
const _logout=logout;window.logout=async function(){if(diffAll().n){await syncNow()}try{GS("logout",TOKEN)}catch(e){}TOKEN="";try{sessionStorage.removeItem("mdro_tok");sessionStorage.removeItem("mdro_user")}catch(e){}restoreU();_logout()};
function sessionExpired(){restoreU();syncSt("Session expired · log in again",2);toast("Session expired. Please log in again; unsaved changes will be sent after you log in.");TOKEN="";$("app").hidden=true;$("login").hidden=false;lgStep(S.role==="uki"?"uki":"ward")}

/* ---------- features that differ from preview ---------- */
window.formLink=c=>`${WEBAPP_URL}?f=${c.fw.token}`;
window.tryPrint=function(){try{window.print()}catch(e){toast("Use Download PDF and print from there.")}};
window.saveFile=async function(name,blob){try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return true}catch(e){toast("Download failed: "+e.message);return false}};
/* read lab report image / PDF with Google Drive OCR */
SAMPLE={ocr:true};   /* auto-read lab report after upload (Google OCR, fallback Tesseract in browser) */
let TESS=null;function loadTess(){if(window.Tesseract)return Promise.resolve();if(TESS)return TESS;TESS=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=res;sc.onerror=()=>rej(new Error("Tesseract could not be loaded"));document.head.appendChild(sc)});return TESS}
async function imgForOcr(a){if(a.type==="application/pdf"){const doc=await pdfDoc(a.data);return(await pdfPage(doc,1,2000)).toDataURL("image/jpeg",.92)}return a.data}
window.readReport=async function(ctx,id){const pre=ctx==="reg"?"rg_":"cf_";const a=attList(ctx).find(x=>x.id===id);if(!a)return;
  const box=$(pre+"readRes");const say=t=>box.innerHTML=`<div class="banner info">${svg("form")}<div><b>${t}</b></div></div>`;
  say("Reading the report (Google OCR)… usually 5–20 seconds.");let text="",how="Google OCR";
  try{if(String(a.data).startsWith("drive:"))await hydrate(a);
    try{text=await GS("ocr",TOKEN,a.data)}catch(e){text="";how="";console.warn("Drive OCR:",e)}
    if(!text||text.length<30){say("Reading the report on the device (Tesseract)… 20–60 seconds the first time.");await loadTess();const r=await Tesseract.recognize(await imgForOcr(a),"eng");text=r&&r.data&&r.data.text||"";how="Tesseract"}
    if(!text||text.length<20)throw new Error("no text detected");
    const x=parseReportText(text);const n=applyExtract(pre,x);showExtract(pre,n,"report image ("+how+")");
    if(!x.name&&!x.ic&&!x.mrn)box.insertAdjacentHTML("beforeend",`<div class="hint">Name/IC could not be detected. Take the photo closer and straighter, or <button class="infbtn" onclick="openPasteReport('${pre}')">paste report text</button>.</div>`)}
  catch(e){box.innerHTML=`<div class="banner warn">${svg("list")}<div>Report could not be read (${esc(e.message||"error")}). <button class="infbtn" onclick="openPasteReport('${pre}')">Paste report text</button></div></div>`}};
/* load attachments / signatures from Drive before showing */
["openCase","openProfile","viewReview","openReview","dlReview"].forEach(fn=>{const f=window[fn];window[fn]=async function(...a){const id=fn==="viewReview"||fn==="dlReview"?a[0]:a[0];if(id)await hydrateCase(id);return f.apply(this,a)}});
{const f=window.viewAtt;window.viewAtt=async function(ctx,id){if(ctx!=="reg")await hydrateCase(ctx);return f(ctx,id)}}

/* ---------- doctor link (?f=token) ---------- */
async function doctorBoot(tok){$("login").hidden=true;syncSt("Loading form…");
  try{const c=await GS("getDoctorCase",tok);syncSt();if(!c){document.body.innerHTML='<div class="doc-err"><h2>Invalid link</h2><p>This form link was not found or has expired. Please contact the ward sister.</p></div>';return}
    CASES=[c];S.role=null;openDoctor(c.id);document.body.classList.add("docmode")}
  catch(e){syncSt();document.body.innerHTML='<div class="doc-err"><h2>Error</h2><p>'+esc(e.message||e)+'</p></div>'}}
{const f=window.docSubmit;window.docSubmit=async function(id){const c=CASES.find(x=>x.id===id);const before=c.fw&&c.fw.status;f(id);
  if(DOC_TOKEN&&c.fw&&(c.fw.status==="filled"||c.fw.status==="verified")&&before!==c.fw.status){syncSt("Sending…");try{await GS("submitDoctorForm",DOC_TOKEN,JSON.parse(JSON.stringify(c)));syncSt("Sent",1)}
    catch(e){syncSt("Send failed",2);c.fw.status=before;$("docView").innerHTML=docShell(c,`<div class="panel pad doc-done"><h2>Form not sent yet</h2><p>${esc(e.message||e)}. Please try again.</p><button class="btn btn-pri" onclick="openDoctor('${id}')">Try again</button></div>`)}}}}

/* ---------- start ---------- */
async function liveBoot(){{const f=$("lgUser");if(f&&f.closest(".fld"))f.closest(".fld").hidden=true}ORIG_U=$("lgStepU").innerHTML;$("lgUser").value="uki";$("lgPass").value="";$("lgWName").value="";$("lgWPass").value="";
  {const l=document.querySelector('label[for="lgWName"]');if(l)l.textContent="Staff name (optional)";try{const w=localStorage.getItem("mdro_ward");if(w)$("lgWard").value=w}catch(e){}}
  const f=$("lgIcn");if(f&&f.closest(".fld"))f.closest(".fld").hidden=true;
  if(DOC_TOKEN){doctorBoot(DOC_TOKEN);return}
  if(!TOKEN)GS("getVersion").catch(()=>{});   /* wake the server while the user types the password */
  if(TOKEN){try{const u=JSON.parse(sessionStorage.getItem("mdro_user")||"null");if(u){await boot(u);return}}catch(e){TOKEN="";syncSt()}}
  lgStep(0)}
{const f=window.lgStep;window.lgStep=function(k){f(k);setTimeout(()=>{const e=k==="uki"?$("lgPass"):k==="ward"?$("lgWPass"):null;if(e)e.focus()},50)}}
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target&&e.target.id==="lgPass")loginUki();if(e.target&&e.target.id==="lgWPass")loginWard()});

/* sejarah banci harian & katil dimuat di belakang supaya log masuk cepat */
async function loadLazy(colls){try{syncSt("Loading history…");const L=await GS("getStore",TOKEN,colls);
  L.forEach(x=>{if(x.coll==="hist"){if(!HIST.some(h=>h.id===x.o.id&&!h._d))HIST.push(x.o)}else if(x.coll==="bedhist")BEDHIST[x.id]=x.o;
    SNAP[x.coll]=SNAP[x.coll]||{};SNAP[x.coll][x.id]=x.coll==="bedhist"?JSON.stringify(x.o):dehydStr(x.o)});
  syncSt();if(["dash","analysis","reports","wards","mapping"].includes(S.tab))refresh()}catch(e){syncSt()}}

liveBoot();
