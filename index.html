/* full form (MDRO/MOH/2022/1) */
const ORG_C={"MRSA":"1","MRO ACB":"2","ESBL KPN":"3","ESBL E Coli":"4","CRE":"5","VRE":"6"};
const ORG_L=[["1","Methicillin-resistant <i>Staphylococcus aureus</i> (MRSA)"],["2","MDR <i>Acinetobacter baumannii</i>"],["3","ESBL <i>Klebsiella pneumoniae</i>"],["4","ESBL <i>Escherichia coli</i>"],["5","Carbapenem Resistant <i>Enterobacteriaceae</i> (CRE)"],["6","Vancomycin Resistant <i>Enterococci</i> (VRE)"],["7","OTHERS, specify (e.g. MDR <i>Pseudomonas</i> / other ESBL organism)"]];
const INF_T=["Blood stream infection (BSI) or Bacteraemia","Surgical site infection (SSI)","Urinary tract infection (UTI)","Hospital acquired pneumonia (VAP)","Hospital acquired pneumonia (Non-VAP)","Skin and soft tissue infection (SSTI)","Intra-abdominal infection","OTHERS, specify"];
const HA_S=["Health Care-Associated, Own Facility","Health Care Associated, other MOH Facility","Health Care-Associated, non MOH Facility","Not Health Care-Associated (Community acquired)"];
const HA_BSI=["HA-MRSA Bacteraemia","HA-MDR <i>Acinetobacter baumannii</i> Bacteraemia","HA-ESBL <i>Klebsiella pneumoniae</i> Bacteraemia","HA-ESBL <i>Escherichia coli</i> Bacteraemia","HA-CRE Bacteraemia"];
function rad(n,v,l,cur,ro){return`<label class="opt"><input type="radio" name="${n}" value="${v}"${String(cur)===String(v)?" checked":""}${ro?" disabled":""}><span>${l}</span></label>`}
function formBody(c,ro){const F=c.form||{};const d=ro?" disabled":"";const v=(k,def)=>esc(F[k]!==undefined?F[k]:def??"");
  const l=locate(c);const row=(()=>{for(const cc of [...CENSUS].sort((a,b)=>b.at-a.at)){const r=cc.rows.find(r=>same(r,c));if(r)return r}return null})();
  const iso=F.iso||(c.hai==="CONTAMINATION"?"3":c.infcol==="COLONIZER"?"2":c.infcol==="INFECTION"?"1":"");
  const inf=F.inf!==undefined?F.inf:(/BLOOD/.test(c.spec)?"0":/URINE/.test(c.spec)?"2":/ETT/.test(c.spec)?"3":/SPUTUM/.test(c.spec)?"4":"");
  const devs=(F.devs||((row&&row.dev)||[]).map(x=>({d:x==="CBD/SPC"?"CBD / SPC":x,t:""}))).slice();while(devs.length<5)devs.push({});
  const abx=(F.abx||[]).slice();while(abx.length<6)abx.push({});
  const haOrg={"MRSA":"0","MRO ACB":"1","ESBL KPN":"2","ESBL E Coli":"3","CRE":"4"}[c.subtype];
  return`<form id="mf" class="nform" onsubmit="event.preventDefault()" onchange="nfT()">
   <div class="nf-top"><span>HOSPITAL: <b>HTPN</b></span><span>DATE: <b>${fmt(F.date||TODAY)}</b></span><span class="mono">MDRO/MOH/2022/1</span></div>
   <fieldset><legend>A. Demographic details</legend><div class="fg">
    <div class="fld"><label for="nf_name">1. Name</label><input id="nf_name" value="${v("name",c.name)}"${d}></div>
    <div class="fld"><label for="nf_mrn">2. MRN</label><input id="nf_mrn" value="${v("mrn",c.rn)}"${d}></div>
    <div class="fld"><label for="nf_ic">3. IC / Passport No.</label><input id="nf_ic" value="${v("ic",c.ic)}"${d}></div>
    <div class="fld"><label for="nf_age">4. Age</label><input id="nf_age" type="number" inputmode="numeric" value="${v("age")}"${d}></div>
    <div class="fld"><label for="nf_sex">5. Gender</label><select id="nf_sex"${d}><option value=""></option><option${F.sex==="Male"?" selected":""}>Male</option><option${F.sex==="Female"?" selected":""}>Female</option></select></div>
    <div class="fld"><label for="nf_adm">6. Date of admission</label><input id="nf_adm" type="date" value="${v("adm",c.adm_date)}"${d}></div>
    <div class="fld"><label for="nf_wadm">7. Ward on admission</label><input id="nf_wadm" value="${v("wadm",c.ward_adm||c.ward)}"${d}></div>
    <div class="fld"><label for="nf_dept">8. Department (origin of MDRO)</label><input id="nf_dept" value="${v("dept",c.dept)}"${d}></div>
    <div class="fld full"><label for="nf_dx">9. Diagnosis on admission</label><input id="nf_dx" value="${v("dx",c.diag_adm)}"${d}></div>
    <div class="fld full"><label>10. Previous encounter to health facility / long term nursing care / dialysis care</label><div class="opts">${rad("nf_prev","Yes","Yes",F.prev||"",ro)}${rad("nf_prev","No","No",F.prev||"",ro)}</div></div>
    <div class="fld nf-prevx full"><label for="nf_prevfac">11. Name of health facility / long term nursing care / dialysis care</label><input id="nf_prevfac" value="${v("prevfac")}"${d}></div>
    <div class="fld nf-prevx"><label for="nf_prevdate">Date of discharge / last visit</label><input id="nf_prevdate" type="date" value="${v("prevdate")}"${d}></div>
    <div class="fld"><label for="nf_sdate">If surgery within 1 month / 1 year (with implant): date</label><input id="nf_sdate" type="date" value="${v("sdate")}"${d}></div>
    <div class="fld full"><label for="nf_stype">Type of operation</label><input id="nf_stype" value="${v("stype")}"${d}></div>
   </div>
   <div class="lbl" style="margin-top:12px">If patient on device</div>
   <div class="tbl-wrap"><table class="abx"><thead><tr><th>#</th><th>Device</th><th>Date of insertion</th></tr></thead><tbody>${devs.map((x,i)=>`<tr><td class="mono">${i+1}</td><td><input class="dv_d" aria-label="Device ${i+1}" value="${esc(x.d)}"${d}></td><td><input class="dv_t" type="date" aria-label="Date of insertion ${i+1}" value="${esc(x.t)}"${d}></td></tr>`).join("")}</tbody></table></div></fieldset>
   <fieldset><legend>B. Positive culture</legend><div class="fg">
    <div class="fld full"><label for="nf_dxspec">1. Diagnosis on specimen taken (not diagnosis on admission)</label><input id="nf_dxspec" value="${v("dxspec",c.diag_spec)}"${d}></div>
    <div class="fld full"><label for="nf_indic">Indication / reason C&amp;S taken</label><input id="nf_indic" value="${v("indic",c.indication||"")}"${d}></div>
    <div class="fld"><label for="nf_sd">2. Date of specimen taken</label><input id="nf_sd" type="date" value="${v("sd",c.sample_date)}"${d}></div>
    <div class="fld"><label for="nf_spec">3. Specimen type</label><input id="nf_spec" value="${v("spec",c.spec+(c.spec_other?" ("+c.spec_other+")":""))}"${d}></div>
    <div class="fld"><label for="nf_pos">4. Date of positive report</label><input id="nf_pos" type="date" value="${v("pos",c.lab_date)}"${d}></div>
    <div class="fld"><label for="nf_loc">5. Location (ward) during specimen collection</label><input id="nf_loc" value="${v("loc",c.ward+(c.bed?" bed "+c.bed:""))}"${d}></div>
   </div></fieldset>
   <fieldset><legend>C. Organism isolated</legend><div class="opts col">${ORG_L.map(([k,lb])=>rad("nf_org",k,lb,F.org||ORG_C[c.subtype]||"7",ro)).join("")}<input id="nf_orgx" aria-label="Organisma lain" placeholder="Specify" value="${v("orgx",ORG_C[c.subtype]?"":(c.organism||c.subtype))}"${d}></div></fieldset>
   <fieldset><legend>D. Isolate status</legend><div class="opts">${rad("nf_iso","1","1. Infection",iso,ro)}${rad("nf_iso","2","2. Colonizer (proceed to F)",iso,ro)}${rad("nf_iso","3","3. Contaminant (omit subsequent questions)",iso,ro)}</div></fieldset>
   <fieldset class="nf-E"><legend>E. Type of infection</legend><div class="opts col">${INF_T.map((lb,i)=>rad("nf_inf",i,`${i+1}. ${lb}`,inf,ro)).join("")}<input id="nf_infx" aria-label="Jenis lain" placeholder="Specify" value="${v("infx")}"${d}></div>
    <div class="nf-bsi"><div class="lbl" style="margin-top:12px">If BSI</div><div class="opts">${["CLABSI","Non-CLABSI","Non-CABSI"].map(x=>rad("nf_bsic",x,{CLABSI:"Central Line Associated BSI (CLABSI)","Non-CLABSI":"Non Central Line Associated BSI (Non-CLABSI)","Non-CABSI":"Non Catheter Associated BSI (Non-CABSI)"}[x],F.bsic||"",ro)).join("")}</div>
     <div class="opts">${rad("nf_bsip","Primary","Primary BSI",F.bsip||"",ro)}${rad("nf_bsip","Secondary","Secondary BSI",F.bsip||"",ro)}</div></div></fieldset>
   <fieldset class="nf-F"><legend>F. Culture positive status</legend><div class="opts col">${HA_S.map((lb,i)=>rad("nf_ha",i,`${i+1}. ${lb}`,F.ha??(c.hai==="NOT HCAI"?"3":c.hai==="HAI - other facility"?"1":c.hai==="HAI - own hospital"?"0":""),ro)).join("")}</div></fieldset>
   <fieldset class="nf-F"><legend>G. Antibiotic(s) exposure within last 3 months</legend><div class="tbl-wrap"><table class="abx"><thead><tr><th>No.</th><th>Name of antibiotic</th><th>Group of antibiotic</th><th>Date started</th><th>Duration (days)</th></tr></thead><tbody>
    ${abx.map((a,i)=>`<tr><td class="mono">${i+1}</td><td><input class="ab_n" aria-label="Antibiotic ${i+1}" value="${esc(a.n)}"${d}></td><td><input class="ab_g" aria-label="Group ${i+1}" value="${esc(a.g)}"${d}></td><td><input class="ab_s" type="date" aria-label="Date started ${i+1}" value="${esc(a.s)}"${d}></td><td><input class="ab_d" type="number" inputmode="numeric" aria-label="Duration ${i+1}" value="${esc(a.dur)}"${d}></td></tr>`).join("")}</tbody></table></div></fieldset>
   <fieldset class="nf-H"><legend>H. Healthcare associated MDRO (HA-MDRO) bacteraemia, for BSI / bacteraemia</legend><div class="opts col">${HA_BSI.map((lb,i)=>rad("nf_habsi",i,`${i+1}. ${lb}`,F.habsi??(haOrg??""),ro)).join("")}</div></fieldset>
   <fieldset class="nf-H"><legend>I. Outcome data at one month of diagnosis (HA-MDRO bacteraemia)</legend><div class="opts">${rad("nf_out","Alive","1. Alive",F.out||"",ro)}${rad("nf_out","Died","2. Died",F.out||"",ro)}</div>
    <div class="fld nf-died"><label>Death related to HA-MDRO bacteraemia</label><div class="opts">${rad("nf_drel","Yes","Yes",F.drel||"",ro)}${rad("nf_drel","No","No",F.drel||"",ro)}</div></div>
    <div class="hint" style="margin-top:6px">Boleh dikemas kini oleh UKI sebulan selepas diagnosis (${fmt(addDays(c.lab_date,30))}).</div></fieldset>
   <fieldset><legend>Prepared by</legend><div class="fg">
    <div class="fld"><label for="nf_by">Name</label><input id="nf_by" value="${v("by",S.docMode?(c.fw&&c.fw.dr)||"":"")}"${d}></div>
    <div class="fld"><label for="nf_bydes">Designation</label><input id="nf_bydes" value="${v("bydes",S.docMode?"Medical Officer":"")}"${d} list="desigList"></div>
    <div class="fld"><label for="nf_bydate">Date</label><input id="nf_bydate" type="date" value="${v("bydate",TODAY)}"${d}></div></div></fieldset>
   <datalist id="desigList"><option value="Medical Officer"></option><option value="House Officer"></option><option value="Specialist"></option><option value="Ketua Jururawat / Sister"></option><option value="Jururawat"></option><option value="Pegawai Kawalan Infeksi"></option></datalist>
  </form>`}
function nfT(){const f=$("mf");if(!f)return;const val=n=>{const r=f.querySelector(`input[name="${n}"]:checked`);return r?r.value:""};const iso=val("nf_iso"),inf=val("nf_inf");
  f.querySelectorAll(".nf-prevx").forEach(e=>e.hidden=val("nf_prev")!=="Yes");f.querySelectorAll(".nf-E").forEach(e=>e.hidden=iso!=="1");f.querySelectorAll(".nf-F").forEach(e=>e.hidden=iso==="3");
  f.querySelectorAll(".nf-H").forEach(e=>e.hidden=!(iso==="1"&&inf==="0"));f.querySelectorAll(".nf-bsi").forEach(e=>e.hidden=inf!=="0");f.querySelectorAll(".nf-died").forEach(e=>e.hidden=val("nf_out")!=="Died");
  $("nf_orgx").hidden=val("nf_org")!=="7";$("nf_infx").hidden=inf!=="7"}
function readForm(){const f=$("mf");const val=n=>{const r=f.querySelector(`input[name="${n}"]:checked`);return r?r.value:""};const g=k=>$(k).value.trim();
  return{date:TODAY,name:g("nf_name"),mrn:g("nf_mrn"),ic:g("nf_ic"),age:g("nf_age"),sex:$("nf_sex").value,adm:g("nf_adm"),wadm:g("nf_wadm"),dept:g("nf_dept"),dx:g("nf_dx"),prev:val("nf_prev"),prevfac:g("nf_prevfac"),prevdate:g("nf_prevdate"),sdate:g("nf_sdate"),stype:g("nf_stype"),
   devs:[...f.querySelectorAll(".dv_d")].map((e,i)=>({d:e.value.trim(),t:f.querySelectorAll(".dv_t")[i].value})).filter(x=>x.d),
   dxspec:g("nf_dxspec"),indic:g("nf_indic"),sd:g("nf_sd"),spec:g("nf_spec"),pos:g("nf_pos"),loc:g("nf_loc"),org:val("nf_org"),orgx:g("nf_orgx"),iso:val("nf_iso"),inf:val("nf_inf"),infx:g("nf_infx"),bsic:val("nf_bsic"),bsip:val("nf_bsip"),ha:val("nf_ha"),
   abx:[...f.querySelectorAll("table.abx tbody tr")].filter(t=>t.querySelector(".ab_n")).map(t=>({n:t.querySelector(".ab_n").value,g:t.querySelector(".ab_g").value,s:t.querySelector(".ab_s").value,dur:t.querySelector(".ab_d").value})).filter(a=>a.n),
   habsi:val("nf_habsi"),out:val("nf_out"),drel:val("nf_drel"),by:g("nf_by"),bydes:g("nf_bydes"),bydate:g("nf_bydate")}}
function checkForm(F){const miss=[];if(!F.age)miss.push("A4 Age");if(!F.sex)miss.push("A5 Gender");if(!F.dx)miss.push("A9 Diagnosis on admission");if(!F.prev)miss.push("A10");if(!F.dxspec)miss.push("B1 Diagnosis on specimen taken");if(!F.iso)miss.push("D Isolate status");
  if(F.iso==="1"&&F.inf==="")miss.push("E Type of infection");if(F.iso!=="3"&&F.ha==="")miss.push("F Culture positive status");if(!F.by)miss.push("Prepared by: name");return miss}
function syncForm(c,F){const set=(k,v)=>{if(v!==undefined&&v!==null&&String(v).trim()!==""&&!String(c[k]||"").trim())c[k]=v};
  set("prev_enc",F.prev==="Yes"?"YES":F.prev==="No"?"NO":"");set("prev_fac",F.prevfac);set("prev_date",F.prevdate);const ab=(F.abx||[]).filter(a=>a.n);set("abx1",ab[0]&&ab[0].n);set("abx2",ab[1]&&ab[1].n);
  set("ward_adm",matchWard(F.wadm));set("adm_date",F.adm);set("diag_adm",F.dx);set("diag_spec",F.dxspec);set("clabsi",F.bsic==="CLABSI"?"CLABSI":F.bsic?"NON-CLABSI":"");set("death_rel",F.drel==="Yes"?"YES":F.drel==="No"?"NO":"")}
function matchWard(t){const u=String(t||"").trim();if(!u)return"";const f=ALL_LOC.find(w=>w.toUpperCase()===u.toUpperCase());return f||wardFromClinic(u)||u}
function applyCls(c,F){syncForm(c,F);if(F.iso==="3"){c.hai="CONTAMINATION";c.infcol=""}else{c.infcol=F.iso==="2"?"COLONIZER":F.iso==="1"?"INFECTION":c.infcol;const h=["HAI - own hospital","HAI - other facility","HAI - other facility","NOT HCAI"][+F.ha];if(F.ha!==""&&h&&!c.hai)c.hai=h}
  if(F.iso==="1"&&F.inf==="0"){c.pbsi=F.bsip==="Primary"?"YES":F.bsip==="Secondary"?"NO":c.pbsi;if(F.ha==="0")c.habsi="YES"}}
/* ward / UKI modal: mode = fill | verify | view */
function openForm(id,mode){const c=CASES.find(x=>x.id===id);mode=mode||(fstat(c)==="verified"?"view":fstat(c)==="filled"?"verify":"fill");
  if(S.role==="ward"&&mode==="fill"){if(fstat(c)==="none"){openSend(id);return}if(fstat(c)==="sent"){openSend(id,true);return}mode="view"}const ro=mode!=="fill";const fw=c.fw||{};
  const ver=mode==="verify";
  openModal(`<div class="m-head"><div class="hx"><h3>MDRO Surveillance Form</h3><p>${esc(c.name)} · ${esc(c.subtype)} · ${esc(c.ward)}${c.bed?" katil "+esc(c.bed):""} · ${fPill(c)}</p></div>${xBtn()}</div>
  <div class="m-body">${fw.filledAt?`<div class="banner info">${svg("form")}<div>Diisi oleh <b>${esc((c.form||{}).by||fw.dr||"doktor")}</b> ${esc((c.form||{}).bydes||"")} pada ${fmt(ymd(new Date(fw.filledAt)))} ${fmtT(fw.filledAt)}.</div></div>`:""}
   ${formBody(c,ro)}
   ${ver||mode==="view"?`<fieldset class="fsec"><legend>Verified by</legend><div class="fg">
    <div class="fld"><label for="vf_name">Name</label><input id="vf_name" value="${esc((c.form||{}).vname||(ver?(S.staff||S.icn):""))}"${ver?"":" disabled"}></div>
    <div class="fld"><label for="vf_des">Designation</label><input id="vf_des" list="desigList" value="${esc((c.form||{}).vdes||(ver?(S.role==="uki"?"Pegawai Kawalan Infeksi":"Ketua Jururawat / Sister"):""))}"${ver?"":" disabled"}></div>
    <div class="fld"><label for="vf_date">Date</label><input id="vf_date" type="date" value="${esc((c.form||{}).vdate||TODAY)}"${ver?"":" disabled"}></div></div></fieldset>`:""}
  </div>
  <div class="m-foot">${mode==="fill"?`<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-ghost" onclick="openSend('${id}')">Hantar ke doktor</button><button class="btn btn-pri" onclick="submitForm('${id}')">Simpan borang</button>`
   :ver?`<button class="btn btn-ghost" onclick="returnForm('${id}')">Pulangkan ke doktor</button><span class="sp"></span>${S.role==="uki"?`<button class="btn btn-ghost" onclick="openForm('${id}','fill')">Betulkan (UKI)</button>`:""}<button class="btn btn-pri" onclick="verifyForm('${id}')">Sahkan borang</button>`
   :`<span class="hint" style="margin:0;align-self:center">Disahkan oleh ${esc((c.form||{}).vname||"—")}</span><span class="sp"></span><button class="btn btn-ghost" onclick="closeModal()">Tutup</button>`}</div>`,true);nfT()}
function submitForm(id){const c=CASES.find(x=>x.id===id);const F=readForm();const miss=checkForm(F);if(miss.length){toast("Belum lengkap: "+miss.join(", "));return}
  c.form={...(c.form||{}),...F};c.fw=c.fw||{token:uid("F")};c.fw.status="filled";c.fw.filledAt=Date.now();applyCls(c,F);
  closeModal();toast("Borang disimpan. Langkah seterusnya: sister / UKI sahkan.");refresh()}
function verifyForm(id){const c=CASES.find(x=>x.id===id);const n=$("vf_name").value.trim();if(!n){toast("Isi nama pengesah.");return}
  c.form={...(c.form||{}),vname:n,vdes:$("vf_des").value.trim(),vdate:$("vf_date").value};c.form_done="YES";c.fw=c.fw||{};c.fw.status="verified";c.fw.verifiedAt=Date.now();
  closeModal();toast("Borang disahkan. MASTERLIST: MDRO FORM COMPLETED & REVIEWED = YES.");refresh()}
function returnForm(id){const c=CASES.find(x=>x.id===id);c.fw.status="sent";closeModal();toast("Borang dipulangkan ke doktor. Tekan Ingatkan untuk hantar semula pautan.");refresh()}

/* doctor view (opened from WhatsApp link, no login) */
function openDoctor(id){const c=CASES.find(x=>x.id===id);c.fw=c.fw||{status:"none",token:uid("F")};S.docMode=id;closeModal();
  $("app").hidden=true;$("login").hidden=true;const v=$("docView");v.hidden=false;window.scrollTo(0,0);
  if(fstat(c)==="filled"||fstat(c)==="verified"){v.innerHTML=docShell(c,`<div class="panel pad doc-done"><h2>Borang sudah dihantar</h2><p>Terima kasih. Borang untuk pesakit ini telah diterima oleh wad ${esc(c.ward)}.</p></div>`);return}
  v.innerHTML=docShell(c,`<div class="banner info">${svg("form")}<div>Sila lengkapkan borang di bawah. Maklumat pesakit dan makmal sudah diisi oleh UKI. App akan beritahu jika ada bahagian wajib yang belum diisi.</div></div>
   <div class="panel pad">${formBody(c,false)}</div>
   <div class="doc-act"><button class="btn btn-pri btn-block" onclick="docSubmit('${id}')">Hantar borang</button></div>`);nfT()}

function docSubmit(id){const c=CASES.find(x=>x.id===id);const F=readForm();const miss=checkForm(F);if(miss.length){toast("Belum lengkap: "+miss.join(", "));return}
  c.form={...(c.form||{}),...F};c.fw.status="filled";c.fw.filledAt=Date.now();applyCls(c,F);
  $("docView").innerHTML=docShell(c,`<div class="panel pad doc-done"><h2>Terima kasih, borang diterima</h2><p>Sister ${esc(c.ward)} akan menyemak dan mengesahkan borang ini. Anda boleh tutup halaman ini.</p></div>`);window.scrollTo(0,0)}
function closeDoctor(){S.docMode=null;$("docView").hidden=true;$("docView").innerHTML="";if(S.role){$("app").hidden=false;refresh()}else $("login").hidden=false}

/* ================= modal / toast / theme ================= */
function xBtn(){return`<button class="x" aria-label="Tutup" onclick="closeModal()">×</button>`}
function openModal(h,wide){const m=$("modal");m.className="modal"+(wide?" wide":"");m.innerHTML=h;$("modalBg").hidden=false;m.scrollTop=0}
function closeModal(){$("modalBg").hidden=true;$("modal").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modalBg").hidden)closeModal()});
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(window._tt);window._tt=setTimeout(()=>e.hidden=true,4200)}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function paintThm(){$("thmBtn").classList.toggle("dark",isDark())}

function resetDemo(){seed();(async()=>{const c=CASES.find(x=>x.subtype==="ESBL KPN"&&x.lab_date===TODAY&&x.bed==="17");if(c)c.att=[await demoSlip(c)]})();S.reg=null;S.ed=null;if(S.role)refresh();toast("Data demo diset semula.")}

/* ===== seret jadual dengan tangan (tetikus): gerak ke tepi & ke bawah tanpa scrollbar ===== */
(function(){let D=null,moved=false;const skip=t=>t.closest("button,a,input,select,textarea,label,[contenteditable]");
  document.addEventListener("mouseover",e=>{const w=e.target.closest&&e.target.closest(".tbl-wrap");if(w)w.classList.toggle("canDrag",w.scrollWidth>w.clientWidth+2)});
  document.addEventListener("mousedown",e=>{if(e.button!==0)return;const w=e.target.closest&&e.target.closest(".tbl-wrap");if(!w||w.scrollWidth<=w.clientWidth+2||skip(e.target))return;
    const sc=w.closest(".modal")||null;D={w,x:e.clientX,y:e.clientY,sl:w.scrollLeft,sc,st:sc?sc.scrollTop:window.scrollY};moved=false;w.classList.add("dragging");e.preventDefault()});
  document.addEventListener("mousemove",e=>{if(!D)return;const dx=e.clientX-D.x,dy=e.clientY-D.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;D.w.scrollLeft=D.sl-dx;if(D.sc)D.sc.scrollTop=D.st-dy;else window.scrollTo(window.scrollX,D.st-dy)});
  document.addEventListener("mouseup",()=>{if(!D)return;D.w.classList.remove("dragging");D=null});
  document.addEventListener("click",e=>{if(moved){moved=false;e.stopPropagation();e.preventDefault()}},true)})();

/* ================= LIVE · Google Apps Script + Google Sheet ================= */
const LIVE=true;
const GS=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...a));
let TOKEN="";try{TOKEN=sessionStorage.getItem("mdro_tok")||""}catch(e){}
const CENSUS_DAYS=35;
const COLLS={cases:()=>CASES,census:()=>CENSUS,moves:()=>MOVES};
const STORES={monthly:()=>MONTHLY,hist:()=>HIST,imports:()=>IMPORTS};
let SNAP={},SYNC={busy:false,again:false,timer:null,err:"",last:0},VER=0;
const BLOB=new Map(),REV=new Map();           /* drive id -> dataURL, dataURL -> drive id */

/* ---------- ids & (de)hydration ---------- */
function keyOf(k,o){if(o.id)return o.id;if(k==="monthly")return o.id="P|"+o.ward+"|"+o.ym;if(k==="hist")return o.id="H|"+o.ward+"|"+o.date;return o.id=uid("X")}
const dehydStr=o=>JSON.stringify(o,(k,v)=>typeof v==="string"&&v.length>200&&v.startsWith("data:")&&REV.has(v)?"drive:"+REV.get(v):v);
function bigStrings(o,out){if(!o||typeof o!=="object")return out;for(const k in o){const v=o[k];if(typeof v==="string"){if(v.startsWith("data:")&&v.length>8000&&!REV.has(v))out.push(v)}else if(v&&typeof v==="object")bigStrings(v,out)}return out}
function driveIds(o,out){if(!o||typeof o!=="object")return out;for(const k in o){const v=o[k];if(typeof v==="string"){if(v.startsWith("drive:")&&!BLOB.has(v.slice(6)))out.add(v.slice(6))}else if(v&&typeof v==="object")driveIds(v,out)}return out}
function fillDrive(o){if(!o||typeof o!=="object")return;for(const k in o){const v=o[k];if(typeof v==="string"){if(v.startsWith("drive:")&&BLOB.has(v.slice(6)))o[k]=BLOB.get(v.slice(6))}else if(v&&typeof v==="object")fillDrive(v)}}
async function hydrate(o){const ids=[...driveIds(o,new Set())];if(ids.length){const m=await GS("getBlobs",TOKEN,ids);Object.entries(m||{}).forEach(([id,d])=>{if(d){BLOB.set(id,d);REV.set(d,id)}})}fillDrive(o)}
async function hydrateCase(id){const c=CASES.find(x=>x.id===id);if(!c)return;const P=CASES.filter(x=>same(x,c));const need=P.some(x=>driveIds(x,new Set()).size);if(need)syncSt("Memuat lampiran…");
  try{await hydrate(P)}catch(e){toast("Lampiran tidak dapat dimuat: "+e.message)}if(need)syncSt()}

/* ---------- snapshot / diff / sync ---------- */
function snapAll(){SNAP={};Object.entries({...COLLS,...STORES}).forEach(([k,f])=>{SNAP[k]={};f().forEach(o=>{if(o._d)return;SNAP[k][keyOf(k,o)]=dehydStr(o)})});
  SNAP.maps={};Object.entries(MAPS).forEach(([k,v])=>SNAP.maps[k]=dehydStr(v));SNAP.bedhist={};Object.entries(BEDHIST).forEach(([k,v])=>SNAP.bedhist[k]=JSON.stringify(v))}
function diffAll(){const up={cases:[],census:[],moves:[],store:[]},del={cases:[],census:[],moves:[],store:[]};let n=0;
  Object.entries({...COLLS,...STORES}).forEach(([k,f])=>{const cur={};f().forEach(o=>{if(o._d)return;const id=keyOf(k,o);const s=dehydStr(o);cur[id]=1;if(SNAP[k]&&SNAP[k][id]===s)return;n++;
      if(STORES[k])up.store.push({coll:k,id,o});else up[k].push(o)});
    Object.keys(SNAP[k]||{}).forEach(id=>{if(!cur[id]){n++;if(STORES[k])del.store.push(k+"::"+id);else del[k].push(id)}})});
  Object.entries(MAPS).forEach(([k,v])=>{if(SNAP.maps[k]!==dehydStr(v)){n++;up.store.push({coll:"maps",id:k,o:v})}});
  Object.keys(SNAP.maps||{}).forEach(k=>{if(!MAPS[k]){n++;del.store.push("maps::"+k)}});
  Object.entries(BEDHIST).forEach(([k,v])=>{if(SNAP.bedhist[k]!==JSON.stringify(v)){n++;up.store.push({coll:"bedhist",id:k,o:v})}});
  return{up,del,n}}
function syncSoon(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,ms??700)}
async function syncNow(){if(!TOKEN||S.docMode&&!S.role)return;if(SYNC.busy){SYNC.again=true;return}
  const d=diffAll();if(!d.n){syncSt();return}SYNC.busy=true;syncSt("Menyimpan…");
  try{const all=[...d.up.cases,...d.up.census,...d.up.moves,...d.up.store.map(x=>x.o)];const big=[...new Set(bigStrings(all,[]))];
    for(const s of big){const id=await GS("uploadBlob",TOKEN,s);BLOB.set(id,s);REV.set(s,id)}
    const pack={up:{cases:d.up.cases.map(o=>JSON.parse(dehydStr(o))),census:d.up.census.map(o=>{const x=JSON.parse(dehydStr(o));x._t=totalsOf(o);return x}),moves:d.up.moves.map(o=>JSON.parse(dehydStr(o))),
      store:d.up.store.map(x=>({coll:x.coll,id:x.id,o:JSON.parse(x.coll==="maps"?dehydStr(x.o):JSON.stringify(x.o))}))},del:d.del};
    const r=await GS("sync",TOKEN,pack);VER=r.ver||VER;
    d.up.cases.forEach(o=>SNAP.cases[o.id]=dehydStr(o));d.up.census.forEach(o=>SNAP.census[o.id]=dehydStr(o));d.up.moves.forEach(o=>SNAP.moves[o.id]=dehydStr(o));
    d.up.store.forEach(x=>{SNAP[x.coll]=SNAP[x.coll]||{};SNAP[x.coll][x.id]=x.coll==="bedhist"?JSON.stringify(x.o):dehydStr(x.o)});
    ["cases","census","moves"].forEach(k=>d.del[k].forEach(id=>delete SNAP[k][id]));d.del.store.forEach(s=>{const[c,id]=s.split("::");if(SNAP[c])delete SNAP[c][id]});
    SYNC.err="";SYNC.last=Date.now();syncSt("Disimpan "+fmtT(Date.now()),1)}
  catch(e){SYNC.err=String(e.message||e);if(/SESSION/.test(SYNC.err)){sessionExpired();}else{syncSt("Gagal simpan · cuba semula",2);setTimeout(()=>syncSoon(0),15000)}}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;syncSoon(0)}}}
function syncSt(t,k){let e=document.getElementById("syncSt");if(!e){e=document.createElement("button");e.id="syncSt";e.className="syncst";e.onclick=()=>syncNow();document.body.appendChild(e)}
  if(!t){e.hidden=true;return}e.hidden=false;e.textContent=t;e.dataset.k=k||0;if(k===1)setTimeout(()=>{if(e.textContent===t)e.hidden=true},2500)}
addEventListener("beforeunload",e=>{if(TOKEN&&diffAll().n){syncNow();e.preventDefault();e.returnValue=""}});

/* hook: every render / modal close / toast triggers a debounced save */
(function(){const r=refresh,cm=closeModal,t=toast,g=go;
  window.refresh=function(){r.apply(this,arguments);syncSoon()};window.closeModal=function(){cm.apply(this,arguments);syncSoon()};
  window.toast=function(){t.apply(this,arguments);syncSoon()};window.go=function(){g.apply(this,arguments);syncSoon()}})();

/* ---------- load ---------- */
function loadAll(d){CASES=d.cases||[];CENSUS=d.census||[];MOVES=d.moves||[];MONTHLY=[];HIST=[];IMPORTS=[];BEDHIST={};MAPS=JSON.parse(JSON.stringify(PLANS));
  (d.store||[]).forEach(x=>{if(x.coll==="monthly")MONTHLY.push(x.o);else if(x.coll==="hist")HIST.push(x.o);else if(x.coll==="imports")IMPORTS.push(x.o);else if(x.coll==="bedhist")BEDHIST[x.id]=x.o;else if(x.coll==="maps")MAPS[x.id]=x.o});
  (d.oldTotals||[]).forEach(t=>HIST.push({...t,_d:true}));VER=d.ver||0;
  if(d.icn&&d.icn.length){ICN.length=0;d.icn.forEach(n=>ICN.push(n))}
  snapAll()}
async function boot(user){syncSt("Memuat data…");const d=await GS("getAll",TOKEN,CENSUS_DAYS);loadAll(d);try{await hydrate(MAPS);snapAll()}catch(e){}syncSt();
  S.role=user.role;if(user.role==="uki"){S.icn=user.name;S.tab="dash"}else{S.ward=user.ward;S.staff=user.staff||user.name;S.tab="census";S.ed=null;S.map.ward=S.ward;S.map.bld=(WCFG[S.ward]||{}).bld||"MB";S.map.edit=false}
  start();setInterval(poll,60000)}
async function poll(){if(!TOKEN||SYNC.busy)return;try{const v=await GS("getVersion");if(v===VER)return;const ch=await GS("getChanges",TOKEN,VER,CENSUS_DAYS);mergeChanges(ch)}catch(e){}}
function mergeChanges(ch){const local=diffAll();const dirty=new Set([...local.up.cases,...local.up.census,...local.up.moves].map(o=>o.id));let n=0;
  [["cases",CASES],["census",CENSUS],["moves",MOVES]].forEach(([k,A])=>(ch[k]||[]).forEach(o=>{if(dirty.has(o.id))return;const i=A.findIndex(x=>x.id===o.id);if(i>=0)A[i]=o;else A.push(o);SNAP[k][o.id]=dehydStr(o);n++}));
  (ch.store||[]).forEach(x=>{const A=x.coll==="monthly"?MONTHLY:x.coll==="hist"?HIST:x.coll==="imports"?IMPORTS:null;if(A){const i=A.findIndex(y=>y.id===x.id);if(i>=0)A[i]=x.o;else A.push(x.o)}else if(x.coll==="bedhist")BEDHIST[x.id]=x.o;else if(x.coll==="maps")MAPS[x.id]=x.o;
    SNAP[x.coll]=SNAP[x.coll]||{};SNAP[x.coll][x.id]=x.coll==="bedhist"?JSON.stringify(x.o):dehydStr(x.o);n++});
  (ch.deleted||[]).forEach(s=>{const[k,id]=s.split("::");const A={cases:CASES,census:CENSUS,moves:MOVES}[k];if(A){const i=A.findIndex(x=>x.id===id);if(i>=0)A.splice(i,1);delete SNAP[k][id];n++}});
  VER=ch.ver||VER;if(n&&S.role&&$("modalBg").hidden&&S.tab!=="register"&&S.tab!=="census")refresh()}

/* ---------- login ---------- */
async function liveLogin(o,errEl){$(errEl).textContent="";syncSt("Log masuk…");
  try{const r=await GS("login",o);TOKEN=r.token;syncSt();
    if(r.user.role==="uki"&&(r.user.auditors||[]).length){pickAuditor(r.user);return}
    saveSess(r.user);await boot(r.user)}
  catch(e){syncSt();$(errEl).textContent=/LOGIN/.test(e.message||e)?"Kata laluan salah.":"Ralat: "+(e.message||e)}}
function saveSess(u){try{sessionStorage.setItem("mdro_tok",TOKEN);sessionStorage.setItem("mdro_user",JSON.stringify(u))}catch(e){}}
function pickAuditor(u){let last="";try{last=localStorage.getItem("mdro_aud")||""}catch(e){}
  $("lgStepU").innerHTML=`<div class="lg-q">Pilih pegawai (auditor)</div><div class="audl">${u.auditors.map(n=>`<button class="btn ${n===last?"btn-pri":"btn-ghost"} btn-block" onclick="chooseAuditor(this.textContent)">${esc(n)}</button>`).join("")}</div><div class="err" id="lgErrU"></div>`}
window.chooseAuditor=async function(n){syncSt("Log masuk…");try{const u=await GS("setAuditor",TOKEN,n);try{localStorage.setItem("mdro_aud",n)}catch(e){}saveSess(u);await boot(u)}catch(e){syncSt();$("lgErrU").textContent="Ralat: "+(e.message||e)}};
window.loginUki=function(){const u=$("lgUser").value.trim()||"uki",p=$("lgPass").value;if(!p){$("lgErrU").textContent="Isi kata laluan.";return}liveLogin({user:u,pass:p},"lgErrU")};
window.loginWard=function(){const w=$("lgWard").value,p=$("lgWPass").value,n=$("lgWName").value.trim()||("Staf "+w);if(!p){$("lgErrW").textContent="Isi kata laluan wad.";return}try{localStorage.setItem("mdro_ward",w)}catch(e){}liveLogin({ward:w,pass:p,staff:n},"lgErrW")};
let ORIG_U="";const restoreU=()=>{if(ORIG_U){$("lgStepU").innerHTML=ORIG_U;$("lgUser").value="uki";{const f=$("lgUser");if(f&&f.closest(".fld"))f.closest(".fld").hidden=true}const f=$("lgIcn");if(f&&f.closest(".fld"))f.closest(".fld").hidden=true}};
const _logout=logout;window.logout=async function(){if(diffAll().n){await syncNow()}try{GS("logout",TOKEN)}catch(e){}TOKEN="";try{sessionStorage.removeItem("mdro_tok");sessionStorage.removeItem("mdro_user")}catch(e){}restoreU();_logout()};
function sessionExpired(){restoreU();syncSt("Sesi tamat · log masuk semula",2);toast("Sesi tamat. Sila log masuk semula; perubahan yang belum disimpan akan dihantar selepas log masuk.");TOKEN="";$("app").hidden=true;$("login").hidden=false;lgStep(S.role==="uki"?"uki":"ward")}

/* ---------- features that differ from preview ---------- */
window.formLink=c=>`${WEBAPP_URL}?f=${c.fw.token}`;
window.tryPrint=function(){try{window.print()}catch(e){toast("Guna Muat turun PDF dan cetak dari situ.")}};
window.saveFile=async function(name,blob){try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return true}catch(e){toast("Muat turun gagal: "+e.message);return false}};
/* read lab report image / PDF with Google Drive OCR */
SAMPLE={ocr:true};   /* auto-read lab report after upload (Google OCR, fallback Tesseract in browser) */
let TESS=null;function loadTess(){if(window.Tesseract)return Promise.resolve();if(TESS)return TESS;TESS=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=res;sc.onerror=()=>rej(new Error("Tesseract tidak dapat dimuat"));document.head.appendChild(sc)});return TESS}
async function imgForOcr(a){if(a.type==="application/pdf"){const doc=await pdfDoc(a.data);return(await pdfPage(doc,1,2000)).toDataURL("image/jpeg",.92)}return a.data}
window.readReport=async function(ctx,id){const pre=ctx==="reg"?"rg_":"cf_";const a=attList(ctx).find(x=>x.id===id);if(!a)return;
  const box=$(pre+"readRes");const say=t=>box.innerHTML=`<div class="banner info">${svg("form")}<div><b>${t}</b></div></div>`;
  say("Membaca laporan (Google OCR)… biasanya 5–20 saat.");let text="",how="Google OCR";
  try{if(String(a.data).startsWith("drive:"))await hydrate(a);
    try{text=await GS("ocr",TOKEN,a.data)}catch(e){text="";how="";console.warn("Drive OCR:",e)}
    if(!text||text.length<30){say("Membaca laporan dalam peranti (Tesseract)… 20–60 saat kali pertama.");await loadTess();const r=await Tesseract.recognize(await imgForOcr(a),"eng");text=r&&r.data&&r.data.text||"";how="Tesseract"}
    if(!text||text.length<20)throw new Error("tiada teks dikesan");
    const x=parseReportText(text);const n=applyExtract(pre,x);showExtract(pre,n,"gambar laporan ("+how+")");
    if(!x.name&&!x.ic&&!x.mrn)box.insertAdjacentHTML("beforeend",`<div class="hint">Nama/IC tidak dapat dikesan. Ambil gambar lebih dekat dan lurus, atau <button class="infbtn" onclick="openPasteReport('${pre}')">tampal teks laporan</button>.</div>`)}
  catch(e){box.innerHTML=`<div class="banner warn">${svg("list")}<div>Laporan tidak dapat dibaca (${esc(e.message||"ralat")}). <button class="infbtn" onclick="openPasteReport('${pre}')">Tampal teks laporan</button></div></div>`}};
/* load attachments / signatures from Drive before showing */
["openCase","openProfile","viewReview","openReview","dlReview"].forEach(fn=>{const f=window[fn];window[fn]=async function(...a){const id=fn==="viewReview"||fn==="dlReview"?a[0]:a[0];if(id)await hydrateCase(id);return f.apply(this,a)}});
{const f=window.viewAtt;window.viewAtt=async function(ctx,id){if(ctx!=="reg")await hydrateCase(ctx);return f(ctx,id)}}

{const f=window.docSubmit;window.docSubmit=async function(id){const c=CASES.find(x=>x.id===id);const before=c.fw&&c.fw.status;f(id);
